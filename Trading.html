<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading</title>
<!-- Local CDN: pinned libs cached in /cdn and served by the app (no internet needed).
     React/ReactDOM 19.3.1 — React 19 ships no UMD build, so these two files are
     the official CommonJS production builds wrapped into `window.React` /
     `window.ReactDOM` globals by src/update_cdn.py. Tailwind 4.3.5 (official
     browser build). No Babel, no JSX.
     The ?v= query is a cache-buster: bump it when a file in /cdn is refreshed. -->
<script src="/cdn/react.umd.min.js?v=19.3.1"></script>
<script src="/cdn/react-dom.umd.min.js?v=19.3.1"></script>
<script src="/cdn/tailwind.browser.js?v=4.3.5"></script>
<!-- Tabulator 6.7.1 (MIT). A real UMD build: a single script tag exposing the
     global `Tabulator`. No import map, no shims, no bundled dependencies. -->
<link rel="stylesheet" href="/cdn/tabulator.min.css?v=6.7.1">
<script src="/cdn/tabulator.min.js?v=6.7.1"></script>
<!-- TradingView Lightweight Charts 5.2.1 (Apache-2.0). Standalone build:
     a single script tag exposing the global `LightweightCharts`.
     Used by the ticker chart modal. -->
<script src="/cdn/lightweight-charts.standalone.production.js?v=5.2.1"></script>
<!-- TA-Lib ported to WebAssembly (BSD-3-Clause). Exposes the global `TA_LIB`;
     `TA_LIB.init('/cdn/talib.wasm')` must resolve before any indicator runs. -->
<script src="/cdn/talib-web.umd.js?v=0.1.3"></script>

<!-- Tailwind v4: theme tokens (colors) + the splash keyframes, all in one place.
     text/tailwindcss = "Tailwind processes this block" (works with the browser build). -->
<style type="text/tailwindcss">
  @theme {
    /* palette (dark + green accent) */
    --color-bg: #080c0a;
    --color-surface: #111916;
    --color-line: #1a2a1e;
    --color-accent: #00cc44;
    --color-glow: #00ff66;
    --color-ink: #e0e8e2;
    --color-muted: #6b7a70;
    --color-on-accent: #04140a;
    /* strong component border: white on dark, black on light (see below) */
    --color-border: #ffffff;
    /* soft horizontal rule between table rows (lighter than --color-border) */
    --color-hline: #ffffff2e;
    /* table header text */
    --color-gold: #ffcc44;
    /* table header background (gold in both themes) */
    --color-header-bg: #d4a017;
    /* header label text: bold black on the gold bar */
    --color-header-ink: #000000;
    /* sort arrow: black, blue + glow on hover */
    --color-sort: #000000;
    --color-sort-hover: #2563eb;
    /* per-column filter button: blue, red on hover */
    --color-filter-btn: #2563eb;
    --color-filter-btn-hover: #dc2626;
    /* theme toggle button: light on dark, dark on light (see below) */
    --color-theme-btn-bg: #e0e8e2;
    --color-theme-btn-ink: #04140a;
    /* columns-dropdown row hover: dark enough for the white drag cursor */
    --color-row-hover: #000000;
    --color-row-hover-ink: #ffffff;

    /* splash animations (define --animate-* to get animate-* utilities) */
    --animate-gold-breathe: gold-breathe 6s ease-in-out infinite;
    --animate-logo-appear: logo-appear .5s ease-out both;
    --animate-logo-glow: logo-glow 3.6s ease-in-out .5s infinite;
    --animate-pre-splash-logo: pre-splash-logo 1.8s cubic-bezier(.2,.7,.25,1) forwards;
    --animate-beam: beam-travel 1s linear infinite;
    --animate-drift: drift 4s ease-in-out infinite;
    --animate-splash-fade: splash-fade 1.2s linear forwards;
    /* easeOutQuad: decelerates gently with no long flat tail, so the motion
       never looks like it stalls mid-way */
    --animate-splash-zoom: splash-zoom 3s cubic-bezier(.25,.46,.45,.94) both;
    --animate-ripple: ripple 3.6s cubic-bezier(.25,.46,.45,.94) infinite both;
    --animate-halo: halo 3.6s ease-in-out infinite;

    /* opacity-only breathe: scaling a full-screen multi-gradient layer forces
       Chrome to re-rasterise the whole backdrop every frame — that was a major
       source of the hitching */
    @keyframes gold-breathe { 0%,100% { opacity:.72; } 50% { opacity:1; } }
    @keyframes logo-appear  { from { opacity:0; } to { opacity:1; } }
    @keyframes pre-splash-logo {
      0%   { opacity:0; transform:translate(-50%,-50%) scale(.1); }
      22%  { opacity:1; transform:translate(-50%,-50%) scale(.5); }
      100% { opacity:1; transform:translate(-50%,calc(-50% - 50vh + 75px)) scale(1.5); }
    }
    /* logo glow: a blurred copy of the logo pulses outwards. Only transform +
       opacity animate, so the layer stays on the compositor. Animating a
       filter (drop-shadow) would re-rasterise the image on the main thread
       every frame, which is what made the splash stutter. The copy is laid
       out at its LARGEST size and scaled down, so it is never upscaled. */
    @keyframes logo-glow    { 0%,100% { opacity:.5; transform:scale(.82); }
                              50%     { opacity:1;  transform:scale(1); } }
    /* whole splash grows out of the centre, slowly */
    @keyframes splash-zoom  { from { opacity:0; transform:scale(.55); } to { opacity:1; transform:scale(1); } }
    /* glow ring: born at the centre, expands outwards and dissolves.
       The ring is laid out at its LARGEST size and only ever scaled DOWN
       (0.18 -> 1), so its texture is rasterised once and never upscaled —
       scaling past 1 would make Chrome repaint the shadow every frame. */
    @keyframes ripple       { 0%   { opacity:0;   transform:scale(.18); }
                              12%  { opacity:.95; }
                              60%  { opacity:.35; }
                              100% { opacity:0;   transform:scale(1); } }
    /* soft halo behind the logo, breathing outwards (same down-scale trick) */
    @keyframes halo         { 0%,100% { opacity:.45; transform:scale(.75); }
                              50%     { opacity:1;   transform:scale(1); } }
    @keyframes beam-travel  { from { transform:translateX(-120%); } to { transform:translateX(310%); } }
    @keyframes drift        { 0%,100% { opacity:.2;  transform:rotate(45deg) translate3d(0,0,0)     scale(.6); }
                              50%     { opacity:.75; transform:rotate(45deg) translate3d(4px,-9px,0) scale(1); } }
    @keyframes splash-fade  { to { opacity:0; } }
  }

  .pre-splash-logo {
    transform: translate(-50%, calc(-50% - 50vh + 75px)) scale(1.5);
  }

  /* Light theme. Every Tailwind colour utility reads these tokens through
     var(--color-*), so overriding them here flips the whole UI at once.
     Applies to <html data-theme="light">, set by the theme switcher. */
  [data-theme="light"] {
    --color-bg: #f4f7f5;
    --color-surface: #ffffff;
    --color-line: #d6e0d9;
    --color-accent: #00a838;
    --color-glow: #00cc44;
    --color-ink: #16201a;
    --color-muted: #5f6f66;
    --color-on-accent: #ffffff;
    --color-border: #000000;
    /* soft horizontal rule between table rows (lighter than --color-border) */
    --color-hline: #0000001f;
    /* table header text: darker gold so it stays readable on white */
    --color-gold: #a06a00;
    /* table header background (gold in both themes) */
    --color-header-bg: #e8b923;
    /* header label text: bold black on the gold bar */
    --color-header-ink: #000000;
    /* sort arrow: black, blue + glow on hover */
    --color-sort: #000000;
    --color-sort-hover: #2563eb;
    /* per-column filter button: blue, red on hover */
    --color-filter-btn: #2563eb;
    --color-filter-btn-hover: #dc2626;
    /* theme toggle button: light on dark, dark on light */
    --color-theme-btn-bg: #16201a;
    --color-theme-btn-ink: #ffffff;
    /* columns-dropdown row hover: black so the white drag cursor is visible */
    --color-row-hover: #000000;
    --color-row-hover-ink: #ffffff;
  }

  /* ---- Tabulator theming -------------------------------------------------
     Tabulator's stock CSS hard-codes colours. These rules re-point them at
     our tokens, so the light/dark switch recolours the table automatically
     (no JS theme objects, no canvas repaint). Your <style> comes after the
     Tabulator <link>, so equal specificity wins on cascade order. */
  html .tabulator {
    background-color: var(--color-surface);
    border: 2px solid var(--color-border);
    border-radius: 10px;
    color: var(--color-ink);
    font-family: inherit;
    font-size: 12px;
  }
  html .tabulator .tabulator-header {
    background-color: var(--color-header-bg);
    border-bottom: 2px solid var(--color-hline);
    color: var(--color-header-ink);
  }
  html .tabulator .tabulator-header .tabulator-col {
    background-color: var(--color-header-bg);
    border-right: 1px solid var(--color-border);
  }
  /* header labels: bold black on the gold bar, left-aligned */
  html .tabulator .tabulator-header .tabulator-col .tabulator-col-content {
    padding: 6px 8px;
    color: var(--color-header-ink);
    font-weight: 700;
    font-size: 11px;
    text-align: left;
  }
  html .tabulator .tabulator-header .tabulator-col .tabulator-col-title {
    color: var(--color-header-ink);
    font-weight: 700;
    text-align: left;
  }
  /* sort arrows — green by default, blue with a glow on hover. The stock
     rules use the full .tabulator-col-content .tabulator-col-sorter
     .tabulator-arrow path, so match it (plus the aria-sort variants) to
     actually win the cascade. */
  html .tabulator .tabulator-header .tabulator-col .tabulator-col-content
    .tabulator-col-sorter .tabulator-arrow {
    border-bottom-color: var(--color-sort);
    transition: border-color .12s ease, filter .12s ease;
  }
  html .tabulator .tabulator-header .tabulator-col.tabulator-sortable[aria-sort="none"]
    .tabulator-col-content .tabulator-col-sorter .tabulator-arrow {
    border-bottom-color: var(--color-sort);
    border-top-color: transparent;
  }
  html .tabulator .tabulator-header .tabulator-col.tabulator-sortable[aria-sort="ascending"]
    .tabulator-col-content .tabulator-col-sorter .tabulator-arrow {
    border-bottom-color: var(--color-sort);
    border-top-color: transparent;
  }
  html .tabulator .tabulator-header .tabulator-col.tabulator-sortable[aria-sort="descending"]
    .tabulator-col-content .tabulator-col-sorter .tabulator-arrow {
    border-top-color: var(--color-sort);
    border-bottom-color: transparent;
  }
  /* hover: blue arrow with a soft glow (works on the gold bar in both themes).
     The arrow itself is the hover target — Tabulator puts
     `tabulator-col-sorter-element` on the column, not on the sorter wrapper. */
  html .tabulator .tabulator-header .tabulator-col .tabulator-col-content
    .tabulator-col-sorter .tabulator-arrow:hover,
  html .tabulator .tabulator-header .tabulator-col.tabulator-sortable:hover
    .tabulator-col-content .tabulator-col-sorter .tabulator-arrow {
    border-bottom-color: var(--color-sort-hover);
    border-top-color: transparent;
    filter: drop-shadow(0 0 4px var(--color-sort-hover)) drop-shadow(0 0 8px var(--color-sort-hover));
  }
  html .tabulator .tabulator-header .tabulator-col.tabulator-sortable[aria-sort="descending"]:hover
    .tabulator-col-content .tabulator-col-sorter .tabulator-arrow {
    border-top-color: var(--color-sort-hover);
    border-bottom-color: transparent;
    filter: drop-shadow(0 0 4px var(--color-sort-hover)) drop-shadow(0 0 8px var(--color-sort-hover));
  }
  /* sortable header hover: stock CSS paints it #cdcdcd (light grey), which is
     unreadable in dark mode — match the stock selector's specificity to win.
     Slightly darken the gold header instead of tinting it with the accent. */
  html .tabulator .tabulator-header .tabulator-col.tabulator-sortable.tabulator-col-sorter-element:hover,
  html .tabulator .tabulator-header .tabulator-col:hover {
    background-color: color-mix(in oklab, #000000 12%, var(--color-header-bg));
  }
  html .tabulator .tabulator-tableholder { background-color: var(--color-surface); }
  /* Tabulator's stock CSS paints the inner table white — that white shows
     through any translucent row colour (e.g. the hover tint), which made
     hovered rows unreadable in dark mode. Theme it too. */
  html .tabulator .tabulator-tableholder .tabulator-table {
    background-color: var(--color-surface);
    color: var(--color-ink);
  }
  html .tabulator .tabulator-row {
    background-color: var(--color-surface);
    border-bottom: 2px solid var(--color-hline);
    color: var(--color-ink);
    font-size: 12px;
  }
  html .tabulator .tabulator-row.tabulator-row-even { background-color: color-mix(in oklab, var(--color-ink) 3%, var(--color-surface)); }
  /* Opaque mixes (not alpha tints) so the row colour never depends on what
     sits behind it — text stays readable in both themes. */
  html .tabulator .tabulator-row.tabulator-selectable:hover {
    background-color: color-mix(in oklab, var(--color-accent) 16%, var(--color-surface));
  }
  html .tabulator .tabulator-row.tabulator-selected {
    background-color: color-mix(in oklab, var(--color-accent) 24%, var(--color-surface));
  }
  html .tabulator .tabulator-row.tabulator-selected:hover {
    background-color: color-mix(in oklab, var(--color-accent) 32%, var(--color-surface));
  }
  html .tabulator .tabulator-row .tabulator-cell {
    border-right: 1px solid var(--color-border);
    padding: 4px 8px;
    color: var(--color-ink);
  }
  html .tabulator .tabulator-row .tabulator-cell.tabulator-align-right { text-align: right; }
  html .tabulator .tabulator-placeholder .tabulator-placeholder-contents { color: var(--color-muted); }

  /* RSI cell: mini bar + value (built by a Tabulator formatter) */
  .rsi-cell { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .rsi-bar { display: block; width: 55px; height: 4px; border-radius: 2px; background: var(--color-line); overflow: hidden; }
  .rsi-bar > i { display: block; height: 100%; }
  .rsi-cell > b { font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---- market tabs (header) -------------------------------------------- */
  /* Same height as the other header buttons (Data Load, Columns, ...) and a
     bright glow on hover. The glow uses the accent token, so it stays visible
     on both the dark and light themes. */
  .market-tab {
    height: auto;
    border: 2px solid var(--color-border);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25);
    transition: box-shadow .15s ease, border-color .15s ease, filter .15s ease, transform .1s ease;
  }
  .market-tab:hover {
    border-color: var(--color-glow);
    filter: brightness(1.35) saturate(1.3);
    box-shadow:
      0 0 0 2px var(--color-glow),
      0 0 14px 4px var(--color-glow),
      0 0 34px 10px color-mix(in oklab, var(--color-glow) 65%, transparent),
      0 0 60px 18px color-mix(in oklab, var(--color-glow) 30%, transparent),
      inset 0 0 20px color-mix(in oklab, var(--color-glow) 45%, transparent);
  }
  .market-tab:active { transform: translateY(1px); }
  .market-tab.is-active {
    border-color: var(--color-glow);
    box-shadow:
      0 0 0 2px var(--color-glow),
      0 0 16px 4px color-mix(in oklab, var(--color-glow) 70%, transparent),
      inset 0 0 14px color-mix(in oklab, var(--color-glow) 28%, transparent);
  }
  /* light theme: the bar is white, so the glow needs a tighter, denser ring
     to read as "bright" instead of washing out */
  [data-theme="light"] .market-tab { color: #ffffff; }
  [data-theme="light"] .market-tab:hover {
    filter: brightness(1.25) saturate(1.4);
    box-shadow:
      0 0 0 2px var(--color-glow),
      0 0 12px 3px var(--color-glow),
      0 0 28px 8px color-mix(in oklab, var(--color-glow) 55%, transparent),
      0 0 48px 14px color-mix(in oklab, var(--color-glow) 22%, transparent),
      inset 0 0 18px color-mix(in oklab, var(--color-glow) 40%, transparent);
  }
  [data-theme="light"] .market-tab.is-active {
    box-shadow:
      0 0 0 2px var(--color-glow),
      0 0 14px 3px color-mix(in oklab, var(--color-glow) 60%, transparent),
      inset 0 0 12px color-mix(in oklab, var(--color-glow) 25%, transparent);
  }

  /* ---- theme toggle button --------------------------------------------- */
  /* Inverted against the current theme: light chip on the dark UI, dark chip
     on the light UI, so it always reads as "switch to the other one". */
  .theme-btn {
    background: var(--color-theme-btn-bg);
    color: var(--color-theme-btn-ink);
  }
  .theme-btn:hover {
    border-color: var(--color-accent);
    box-shadow: 0 0 10px 1px color-mix(in oklab, var(--color-accent) 45%, transparent);
  }

  /* ---- text inputs: caret + selection ---------------------------------- */
  /* The browser default caret is white, which is invisible on the light
     theme's white inputs. Follow the theme's ink colour instead. */
  input, textarea, select, [contenteditable] {
    caret-color: var(--color-ink);
  }
  input::selection, textarea::selection, [contenteditable]::selection {
    background: color-mix(in oklab, var(--color-accent) 35%, transparent);
    color: var(--color-ink);
  }
  /* Tabulator's own inputs (filter popups, editors) too. */
  html .tabulator input, html .tabulator textarea {
    caret-color: var(--color-ink);
  }

  /* ---- columns dropdown: draggable rows -------------------------------- */
  /* The OS drag cursor is a white hand, so the hover background must be dark
     enough for it to stay visible — black in light mode, near-black in dark. */
  .col-row {
    cursor: grab;
    transition: background-color .12s, color .12s;
  }
  .col-row:hover {
    background: var(--color-row-hover);
    color: var(--color-row-hover-ink);
  }
  .col-row:hover .col-row-grip { color: var(--color-row-hover-ink); }
  .col-row.is-dragging { opacity: .4; }
  .col-row.is-over { box-shadow: inset 0 2px 0 0 var(--color-accent); }

  /* ---- per-column filter: header button + popup ------------------------- */
  /* width:max-content lets Tabulator's fitData layout measure the real header
     width (label + filter button) instead of a collapsed 100% box. */
  .col-title { display: flex; align-items: center; gap: 4px; width: max-content; max-width: 100%; }
  .col-title-label { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .col-filter-btn {
    flex: none; display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; padding: 0; border-radius: 4px;
    border: 1px solid var(--color-border); background: var(--color-filter-btn);
    color: #ffffff; line-height: 1; cursor: pointer;
    transition: color .12s, background-color .12s, border-color .12s, box-shadow .12s;
  }
  .col-filter-btn svg { display: block; }
  .col-filter-btn:hover {
    background: var(--color-filter-btn-hover);
    border-color: var(--color-filter-btn-hover);
    color: #ffffff;
    box-shadow: 0 0 8px 1px color-mix(in oklab, var(--color-filter-btn-hover) 65%, transparent);
  }
  /* an active filter keeps the button red so it stands out from the blue ones */
  .col-filter-btn.is-active {
    background: var(--color-filter-btn-hover);
    border-color: var(--color-filter-btn-hover);
    color: #ffffff;
    box-shadow: 0 0 8px 1px color-mix(in oklab, var(--color-filter-btn-hover) 55%, transparent);
  }

  .col-filter-popup {
    position: fixed; z-index: 9000; display: flex; flex-direction: column;
    max-height: 400px; overflow: hidden; border-radius: 10px;
    border: 2px solid var(--color-border); background: var(--color-surface);
    color: var(--color-ink); font-size: 12px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, .5);
  }
  .col-filter-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 10px; border-bottom: 2px solid var(--color-border);
  }
  .col-filter-title {
    font-weight: 700; font-size: 11px; color: var(--color-ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .col-filter-reset {
    flex: none; border: 0; background: transparent; color: var(--color-accent);
    font-size: 11px; font-weight: 600; cursor: pointer; padding: 0;
  }
  .col-filter-reset:hover { color: var(--color-glow); }
  .col-filter-body { display: flex; flex-direction: column; min-height: 0; padding: 8px 10px 10px; gap: 8px; }
  .col-filter-search {
    width: 100%; border-radius: 7px; border: 2px solid var(--color-border);
    background: var(--color-bg); color: var(--color-ink);
    padding: 5px 8px; font-size: 12px; outline: none;
  }
  .col-filter-search:focus { border-color: var(--color-accent); }
  .col-filter-all, .col-filter-item {
    display: flex; align-items: center; gap: 7px; cursor: pointer;
    padding: 3px 2px; border-radius: 5px;
  }
  .col-filter-all { border-bottom: 2px solid var(--color-border); padding-bottom: 6px; font-weight: 600; }
  .col-filter-item:hover { background: color-mix(in oklab, var(--color-accent) 12%, transparent); }
  .col-filter-list { overflow-y: auto; min-height: 0; max-height: 240px; }
  .col-filter-val { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .col-filter-count { flex: none; font-size: 10px; color: var(--color-muted); font-variant-numeric: tabular-nums; }
  .col-filter-all input, .col-filter-item input { accent-color: var(--color-accent); }
  .col-filter-hint { font-size: 10px; color: var(--color-muted); font-variant-numeric: tabular-nums; }

  /* numeric filter: two number boxes + a dual-handle slider */
  .col-filter-nums { display: flex; align-items: center; gap: 6px; }
  .col-filter-nums input {
    width: 100%; min-width: 0; border-radius: 7px; border: 2px solid var(--color-border);
    background: var(--color-bg); color: var(--color-ink);
    padding: 5px 7px; font-size: 12px; outline: none;
    font-variant-numeric: tabular-nums;
  }
  .col-filter-nums input:focus { border-color: var(--color-accent); }
  .col-filter-nums span { flex: none; color: var(--color-muted); font-size: 11px; }
  .dual-range { position: relative; height: 24px; margin-top: 2px; }
  .dual-range .track, .dual-range .fill {
    position: absolute; top: 50%; height: 4px; transform: translateY(-50%); border-radius: 2px;
  }
  .dual-range .track { left: 0; right: 0; background: var(--color-line); }
  /* --slider-color lets a single slider be tinted (model zone colour). */
  .dual-range .fill { background: var(--slider-color, var(--color-accent)); }
  .dual-range input[type="range"] {
    position: absolute; left: 0; top: 0; width: 100%; height: 24px; margin: 0;
    background: none; pointer-events: none; -webkit-appearance: none; appearance: none;
  }
  .dual-range input[type="range"]::-webkit-slider-runnable-track { background: transparent; height: 24px; }
  .dual-range input[type="range"]::-moz-range-track { background: transparent; height: 24px; }
  .dual-range input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; pointer-events: auto; width: 14px; height: 14px; margin-top: 5px;
    border-radius: 50%; background: var(--slider-color, var(--color-accent));
    border: 2px solid var(--color-surface);
    box-shadow: 0 0 0 1px var(--slider-color, var(--color-accent)); cursor: pointer;
  }
  .dual-range input[type="range"]::-moz-range-thumb {
    pointer-events: auto; width: 14px; height: 14px; border-radius: 50%;
    background: var(--slider-color, var(--color-accent));
    border: 2px solid var(--color-surface);
    box-shadow: 0 0 0 1px var(--slider-color, var(--color-accent)); cursor: pointer;
  }

  /* ---- dropdown scrollbars ---------------------------------------------
     The indicator / models menus scroll, and the stock scrollbar is either
     invisible or a bright OS default that fights the theme. These rules give
     both a slim, themed bar that only shows its thumb on hover. */
  .menu-scroll { scrollbar-width: thin; scrollbar-color: var(--color-muted) transparent; }
  .menu-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
  .menu-scroll::-webkit-scrollbar-track { background: transparent; }
  .menu-scroll::-webkit-scrollbar-thumb {
    background: color-mix(in oklab, var(--color-muted) 55%, transparent);
    border-radius: 6px;
    /* Inset the thumb so it reads as a slim pill, not a full-width block. */
    border: 3px solid transparent;
    background-clip: content-box;
  }
  .menu-scroll::-webkit-scrollbar-thumb:hover {
    background: var(--color-accent);
    background-clip: content-box;
  }
  .menu-scroll::-webkit-scrollbar-corner { background: transparent; }
</style>
</head>

<body class="bg-bg text-ink text-sm min-h-screen font-['Segoe_UI',system-ui,-apple-system,sans-serif]">

<!-- Everything (splash + app) is one React tree, written without JSX:
     h = React.createElement, so no Babel is needed. -->
<div id="root"></div>

<script type="module">
// Tabulator 6 (UMD global) + React 19. No JSX, no Babel, no bundler.
// Tabulator is a plain UMD global (`window.Tabulator`) — no import needed.
const { useState, useEffect, useLayoutEffect, useRef, useMemo } = React;
const h = React.createElement;

// Read a response as JSON without ever throwing a parse error.
// A server crash used to answer with the plain text "Internal Server Error",
// and `r.json()` turned that into "Unexpected token 'I', \"Internal S\"... is
// not valid JSON" — which hid the real problem. This returns the parsed body,
// or { error } carrying the HTTP status and the start of the raw text.
async function readJson(res) {
  const text = await res.text();
  try {
    return text ? JSON.parse(text) : {};
  } catch {
    const snippet = text.trim().slice(0, 200);
    return {
      error: 'HTTP ' + res.status + (snippet ? ': ' + snippet : ' (empty body)'),
    };
  }
}

/* ================================================================ splash */
// Glowing gold diamonds, scattered once, drifting softly (pure CSS animation).
// Kept to a modest count with a single shadow: every extra shadowed element
// adds raster work to the layer the splash zoom scales.
function Sparkles({ count = 60 }) {
  const dots = useMemo(() =>
    Array.from({ length: count }, (_, i) => ({
      id: i,
      left: Math.random() * 100,
      top: Math.random() * 100,
      delay: Math.random() * 4,
      duration: 3 + Math.random() * 3.5,
      size: (1.5 + Math.random() * 2) * 3,
    })), [count]);
  return h('div', null, dots.map(d => h('div', {
    key: d.id,
    className: 'absolute animate-drift bg-[rgba(255,225,165,.98)] ' +
               'shadow-[0_0_16px_5px_rgba(255,205,80,.55)]',
    style: {
      left: d.left + '%', top: d.top + '%',
      width: d.size + 'px', height: d.size + 'px',
      animationDelay: d.delay + 's', animationDuration: d.duration + 's',
    },
  })));
}

// Logo fades in within .5s. Behind it: a breathing halo, three ripple rings
// born at the centre that grow outwards, and a blurred copy of the logo whose
// glow pulses outwards. Every layer animates only transform/opacity so the
// whole thing stays on the compositor (no per-frame repaint).
function SplashLogo() {
  const imgSize = 'h-auto w-auto max-w-[min(840px,86vw)] max-h-[min(56vh,500px)]';
  const ringBox = 'h-[min(1200px,120vw)] w-[min(1200px,120vw)]';
  return h('div', { className: 'relative z-[2] flex-none flex items-center justify-center animate-logo-appear' },
    // Decor layer, centred on the LOGO (not on the viewport) so the halo, the
    // ripples and the glow are concentric with it.
    //
    // Centring note: `inset-0 m-auto` cannot centre a box that is LARGER than
    // its container — CSS clamps the negative auto margins to 0, which pinned
    // these layers to the left edge and made the ripple/glow sit off-centre to
    // the right. Flexbox centres overflowing items correctly, so the oversized
    // layers live in a full-size flex box instead.
    h('div', { className: 'pointer-events-none absolute inset-0 flex items-center justify-center' },
      h('div', { className: 'relative flex-none flex items-center justify-center ' + ringBox },
        // halo is laid out at its LARGEST size and only ever scaled down by
        // the keyframes, so its texture is rasterised once and never upscaled.
        h('div', {
          className: 'absolute inset-0 m-auto rounded-full animate-halo ' +
                     'h-[min(1100px,110vw)] w-[min(1100px,110vw)] ' +
                     'bg-[radial-gradient(circle,rgba(255,215,100,.38)_0%,rgba(255,190,50,.14)_45%,transparent_72%)]',
        }),
        [0, 1, 2].map(i => h('div', {
          key: i,
          className: 'absolute inset-0 rounded-full border-[3px] border-[rgba(255,225,140,.85)] animate-ripple ' +
                     'bg-[radial-gradient(circle,transparent_56%,rgba(255,205,70,.14)_74%,rgba(255,225,140,.22)_88%,transparent_94%)]',
          style: { animationDelay: (i * 1.2) + 's' },
        })))),
    // glow: a blurred duplicate of the logo, exactly the logo's box so it can
    // never drift off-centre, that scales outwards and back. The blur spreads
    // it past the logo's edges and the keyframes only ever scale it DOWN, so
    // the blurred texture is never re-rasterised.
    h('img', {
      src: '/logo.png', alt: '', 'aria-hidden': 'true',
      className: 'pointer-events-none absolute inset-0 h-full w-full object-contain ' +
                 'animate-logo-glow will-change-transform blur-[20px] saturate-[1.7]',
    }),
    h('img', {
      src: '/logo.png', alt: 'Trading',
      className: 'relative z-[1] ' + imgSize,
    }));
}

// Blank 36px track, 800px wide; one light pulse travels the width every 1s.
function SplashBar() {
  return h('div', {
    className: 'relative z-[2] flex-none mt-[34px] h-[36px] w-[min(800px,88vw)] ' +
               'overflow-hidden rounded-[18px] border border-[rgba(255,200,60,.12)]',
  },
    h('div', {
      className: 'absolute inset-y-0 left-0 w-[34%] animate-beam rounded-[18px] ' +
                 'bg-[linear-gradient(90deg,transparent,rgba(255,215,100,.85)_50%,transparent)] ' +
                 'shadow-[0_0_18px_rgba(255,200,60,.55)]',
    }));
}

// The logo is pinned above the splash after the center-to-top animation.
function PreSplash({ splashFinished, onComplete }) {
  const [parked, setParked] = useState(false);
  useEffect(() => {
    const timer = setTimeout(() => {
      setParked(true);
      if (onComplete) onComplete();
    }, 1800);
    return () => clearTimeout(timer);
  }, []);
  if (splashFinished) return null;
  return h(React.Fragment, null,
    !parked ? h('div', {
      className: 'fixed inset-0 z-[10000] bg-black',
    }) : null,
    h('img', {
      src: '/cdn/mds_logo.png',
      alt: '',
      'aria-hidden': 'true',
      className: 'pre-splash-logo fixed left-1/2 top-1/2 z-[10001] ' +
                 'w-[min(90vw,576px)] h-auto will-change-transform ' +
                 (!parked ? 'animate-pre-splash-logo' : ''),
    }));
}

// Full-screen gold overlay. At 3200ms it starts fading and releases the app
// to build its table; the 1.2s fade completes at 4400ms.
function SplashScreen({ onDone, onFinished }) {
  const [leaving, setLeaving] = useState(false);
  const [gone, setGone] = useState(false);
  useEffect(() => {
    const t1 = setTimeout(() => {
      setLeaving(true);
      if (onDone) onDone();
    }, 3200);
    const t2 = setTimeout(() => {
      setGone(true);
      if (onFinished) onFinished();
    }, 4400);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);
  if (gone) return null;
  return h('div', {
    id: 'splash',
    className: 'fixed inset-0 z-[9999] overflow-hidden bg-black' +
               (leaving ? ' animate-splash-fade pointer-events-none' : ''),
  },
    // The backdrop and sparkles sit OUTSIDE the zoom layer on purpose: they are
    // full-screen and expensive to rasterise, so scaling them would repaint
    // everything each frame. Only the logo + bar zoom.
    h('div', {
      className: 'pointer-events-none absolute -inset-[10%] animate-gold-breathe ' +
        'bg-[radial-gradient(ellipse_at_50%_40%,rgba(255,215,100,.28)_0%,rgba(255,180,40,.10)_40%,transparent_70%),' +
        'radial-gradient(ellipse_at_30%_70%,rgba(255,200,60,.07)_0%,transparent_50%),' +
        'radial-gradient(ellipse_at_70%_70%,rgba(255,200,60,.07)_0%,transparent_50%)]',
    }),
    h(Sparkles),
    // logo + progress bar zoom in slowly from the centre
    h('div', {
      className: 'absolute inset-0 flex flex-col items-center justify-center ' +
                 'animate-splash-zoom will-change-transform',
    },
      h(SplashLogo),
      h(SplashBar)));
}

/* ================================================================ helpers */
function fmtCell(col, val) {
  if (val === null || val === undefined) return '—';
  if (typeof val === 'boolean') return val ? '✓' : '';
  if (col && col.kind === 'int') return String(Math.round(Number(val)));
  if (col && col.dec !== undefined) return Number(val).toFixed(col.dec);
  return String(val);
}

/* ============================================================ data table */
// RSI cell: Tabulator formatters receive a CellComponent and may return a
// DOM node, so we build a small bar + the number (styled by .rsi-* in <style>).
function rsiFormatter(cell) {
  const v = Number(cell.getValue());
  const wrap = document.createElement('div');
  wrap.className = 'rsi-cell';
  const bar = document.createElement('span');
  bar.className = 'rsi-bar';
  const fill = document.createElement('i');
  fill.style.width = Math.max(0, Math.min(100, v || 0)) + '%';
  fill.style.background = v > 70 ? '#ef4444' : v < 30 ? '#00cc44' : '#3b82f6';
  bar.appendChild(fill);
  const num = document.createElement('b');
  num.textContent = Number.isFinite(v) ? v.toFixed(1) : '—';
  wrap.append(bar, num);
  return wrap;
}

// Decimal formatter for the numeric columns (dash for missing values).
const decFormatter = (dec) => (cell) => {
  const v = cell.getValue();
  return (v === null || v === undefined) ? '—' : Number(v).toFixed(dec);
};

/* ====================================================== column filters */
// Every column gets a filter button in its header. Text columns filter by a
// value checklist (select all / reset / search); numeric columns filter by a
// min–max range with two number boxes and a dual-handle slider.
const NUMERIC_KINDS = ['num', 'int', 'rsi'];
const isNumericCol = (c) => NUMERIC_KINDS.includes(c.kind);

// Distinct values (with row counts) for a text column, sorted naturally.
function distinctValues(objects, field) {
  const counts = new Map();
  for (const o of objects) {
    const v = o[field];
    const k = (v === null || v === undefined) ? '' : String(v);
    counts.set(k, (counts.get(k) || 0) + 1);
  }
  return [...counts.entries()]
    .map(([value, count]) => ({ value, count }))
    .sort((a, b) => a.value.localeCompare(b.value, undefined, { numeric: true, sensitivity: 'base' }));
}

// Min / max of a numeric column (ignores blanks and non-numbers).
function numericBounds(objects, field) {
  let min = Infinity, max = -Infinity;
  for (const o of objects) {
    const n = Number(o[field]);
    if (!Number.isFinite(n)) continue;
    if (n < min) min = n;
    if (n > max) max = n;
  }
  return Number.isFinite(min) ? { min, max } : { min: 0, max: 0 };
}

// Header title: label + a small filter button. Built as plain DOM because
// Tabulator's titleFormatter returns a node, not React.
const FUNNEL_SVG =
  '<svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" ' +
  'stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M3 4h18l-7 8v7l-4 2v-9z"/></svg>';

function makeTitleFormatter(field, label, openRef) {
  return function () {
    const wrap = document.createElement('div');
    wrap.className = 'col-title';
    const span = document.createElement('span');
    span.className = 'col-title-label';
    span.textContent = label;
    span.title = label;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'col-filter-btn';
    btn.dataset.field = field;
    btn.title = 'Filter ' + label;
    btn.innerHTML = FUNNEL_SVG;
    // stop the header's sort handler from firing on the button
    btn.addEventListener('mousedown', e => e.stopPropagation());
    btn.addEventListener('click', e => { e.stopPropagation(); openRef.current(field, btn); });
    wrap.append(span, btn);
    return wrap;
  };
}

// Popup shell: positions itself under the header button, closes on outside
// click / Escape, and carries the title + Reset action.
function FilterPopup({ anchor, title, onReset, onClose, children }) {
  const boxRef = useRef(null);
  const [pos, setPos] = useState(null);

  // Position once the popup has been measured, then keep it anchored on
  // scroll / resize. Runs only on mount (and when the anchor changes) — a
  // dependency-free effect here would set state on every render and loop.
  useLayoutEffect(() => {
    const place = () => {
      const el = boxRef.current;
      if (!el) return;
      const r = anchor.getBoundingClientRect();
      const w = el.offsetWidth, hh = el.offsetHeight;
      let left = r.right - w;
      left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
      let top = r.bottom + 6;
      if (top + hh > window.innerHeight - 8) top = Math.max(8, r.top - hh - 6);
      setPos(p => (p && p.left === left && p.top === top) ? p : { left, top });
    };
    place();
    window.addEventListener('resize', place);
    window.addEventListener('scroll', place, true);
    return () => {
      window.removeEventListener('resize', place);
      window.removeEventListener('scroll', place, true);
    };
  }, [anchor]);

  useEffect(() => {
    const onDown = (e) => {
      if (boxRef.current && !boxRef.current.contains(e.target)) onClose();
    };
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('mousedown', onDown);
    document.addEventListener('keydown', onKey);
    return () => {
      document.removeEventListener('mousedown', onDown);
      document.removeEventListener('keydown', onKey);
    };
  }, [onClose]);

  return h('div', {
    ref: boxRef,
    className: 'col-filter-popup',
    style: {
      left: (pos ? pos.left : -9999) + 'px',
      top: (pos ? pos.top : -9999) + 'px',
      width: '252px',
    },
  },
    h('div', { className: 'col-filter-head' },
      h('span', { className: 'col-filter-title', title }, title),
      h('button', { className: 'col-filter-reset', onClick: onReset }, 'Reset')),
    children);
}

// Text column: checklist of every distinct value.
function SetFilter({ options, filter, onChange }) {
  const [q, setQ] = useState('');
  const all = options.map(o => o.value);
  const selected = (filter && filter.kind === 'set') ? new Set(filter.values) : new Set(all);
  const needle = q.trim().toLowerCase();
  const shown = needle ? options.filter(o => o.value.toLowerCase().includes(needle)) : options;
  const allChecked = shown.length > 0 && shown.every(o => selected.has(o.value));
  const someChecked = shown.some(o => selected.has(o.value));

  // Everything selected == no filter at all.
  const commit = (next) => onChange(next.size === all.length ? null : { kind: 'set', values: [...next] });
  const toggle = (v) => {
    const next = new Set(selected);
    if (next.has(v)) next.delete(v); else next.add(v);
    commit(next);
  };
  const toggleAll = () => {
    const next = new Set(selected);
    if (allChecked) shown.forEach(o => next.delete(o.value));
    else shown.forEach(o => next.add(o.value));
    commit(next);
  };

  return h('div', { className: 'col-filter-body' },
    h('input', {
      className: 'col-filter-search', type: 'text', value: q,
      placeholder: 'Search values…', onChange: e => setQ(e.target.value),
    }),
    h('label', { className: 'col-filter-all' },
      h('input', {
        type: 'checkbox', checked: allChecked,
        ref: el => { if (el) el.indeterminate = !allChecked && someChecked; },
        onChange: toggleAll,
      }),
      h('span', { className: 'col-filter-val' }, 'Select all'),
      h('span', { className: 'col-filter-count' }, selected.size + '/' + all.length)),
    h('div', { className: 'col-filter-list' },
      shown.length
        ? shown.map(o => h('label', { key: o.value, className: 'col-filter-item' },
            h('input', {
              type: 'checkbox', checked: selected.has(o.value),
              onChange: () => toggle(o.value),
            }),
            h('span', { className: 'col-filter-val', title: o.value },
              o.value === '' ? '(blank)' : o.value),
            h('span', { className: 'col-filter-count' }, o.count)))
        : h('div', { className: 'col-filter-hint' }, 'No matching values')));
}

// Numeric column: two number boxes + a dual-handle range slider.
function RangeFilter({ bounds, filter, dec, onChange }) {
  const lo0 = bounds.min, hi0 = bounds.max;
  const span = hi0 - lo0;
  const step = span > 0 ? Math.max(span / 500, dec ? Math.pow(10, -dec) : 0.0001) : 1;
  const cur = (filter && filter.kind === 'range') ? filter : { min: lo0, max: hi0 };
  const lo = Math.max(lo0, Math.min(cur.min, hi0));
  const hi = Math.max(lo0, Math.min(cur.max, hi0));

  const fmt = (v) => (dec !== undefined && dec !== null)
    ? Number(v).toFixed(dec)
    : String(Math.round(v * 1000) / 1000);

  // Free-typing text state for the two boxes, committed on blur / Enter.
  const [loText, setLoText] = useState(fmt(lo));
  const [hiText, setHiText] = useState(fmt(hi));
  useEffect(() => { setLoText(fmt(lo)); }, [lo]);
  useEffect(() => { setHiText(fmt(hi)); }, [hi]);

  const emit = (nlo, nhi) => {
    if (nlo <= lo0 && nhi >= hi0) onChange(null);   // full range == no filter
    else onChange({ kind: 'range', min: nlo, max: nhi });
  };
  const setLo = (v) => { const n = Number(v); if (Number.isFinite(n)) emit(Math.min(n, hi), hi); };
  const setHi = (v) => { const n = Number(v); if (Number.isFinite(n)) emit(lo, Math.max(n, lo)); };

  const pct = (v) => (span > 0 ? ((v - lo0) / span) * 100 : 0);
  const commitLo = () => { const n = Number(loText); if (Number.isFinite(n)) setLo(n); else setLoText(fmt(lo)); };
  const commitHi = () => { const n = Number(hiText); if (Number.isFinite(n)) setHi(n); else setHiText(fmt(hi)); };
  const onEnter = (fn) => (e) => { if (e.key === 'Enter') { fn(); e.currentTarget.blur(); } };

  return h('div', { className: 'col-filter-body' },
    h('div', { className: 'col-filter-nums' },
      h('input', {
        type: 'number', value: loText, step, min: lo0, max: hi0,
        onChange: e => setLoText(e.target.value),
        onBlur: commitLo, onKeyDown: onEnter(commitLo),
      }),
      h('span', {}, '–'),
      h('input', {
        type: 'number', value: hiText, step, min: lo0, max: hi0,
        onChange: e => setHiText(e.target.value),
        onBlur: commitHi, onKeyDown: onEnter(commitHi),
      })),
    h('div', { className: 'dual-range' },
      h('div', { className: 'track' }),
      h('div', { className: 'fill', style: { left: pct(lo) + '%', right: (100 - pct(hi)) + '%' } }),
      h('input', {
        type: 'range', min: lo0, max: hi0, step, value: lo,
        onChange: e => setLo(Number(e.target.value)),
      }),
      h('input', {
        type: 'range', min: lo0, max: hi0, step, value: hi,
        onChange: e => setHi(Number(e.target.value)),
      })),
    h('div', { className: 'col-filter-hint' },
      'Range: ' + fmt(lo0) + ' – ' + fmt(hi0)));
}

// Our API column spec -> Tabulator column definitions.
function toColumnDefs(columns, openRef) {
  return columns.map(c => {
    const numeric = isNumericCol(c);
    const def = {
      title: c.label,
      field: c.key,
      // No fixed width: `layout: 'fitData'` auto-fits every column to its
      // widest cell (header included) on build and after each data change.
      minWidth: 90,
      sorter: numeric ? 'number' : 'string',
      hozAlign: numeric ? 'right' : 'left',
      resizable: true,
      headerSort: true,
      // label + per-column filter button
      titleFormatter: makeTitleFormatter(c.key, c.label, openRef),
    };
    if (c.kind === 'rsi') def.formatter = rsiFormatter;
    else if (c.dec !== undefined && c.kind !== 'text') def.formatter = decFormatter(c.dec);
    return def;
  });
}

// Row arrays (from the API) -> one object per row, keyed by column key.
function toRowObjects(columns, rows) {
  return rows.map(r => {
    const o = {};
    for (let i = 0; i < columns.length; i++) o[columns[i].key] = r[i];
    return o;
  });
}

// Re-apply a saved key order to a fresh set of column defs. Keys that no
// longer exist (other market tab, API change) are ignored. New keys are
// inserted at their natural position — right after the nearest preceding
// column the saved order already knows about — so a newly added column lands
// where the API declares it instead of being exiled to the far right.
function orderColumnDefs(defs, order) {
  const byKey = new Map(defs.map(d => [d.field, d]));
  const out = [];
  (order || []).forEach(k => {
    const d = byKey.get(k);
    if (d) { out.push(d); byKey.delete(k); }
  });
  if (!byKey.size) return out;

  // Natural index of each column, used to place the newcomers.
  const natural = new Map(defs.map((d, i) => [d.field, i]));
  defs.forEach(d => {
    if (!byKey.has(d.field)) return;
    // Nearest preceding column that is already placed; -1 => before everything.
    let at = 0;
    for (let i = natural.get(d.field) - 1; i >= 0; i--) {
      const pos = out.findIndex(p => p.field === defs[i].field);
      if (pos !== -1) { at = pos + 1; break; }
    }
    out.splice(at, 0, d);
    byKey.delete(d.field);
  });
  return out;
}

function DataTable({ columns, rows, prefs, onPrefsChange, epoch, filterReset, onRowClick }) {
  const hostRef = useRef(null);
  const tableRef = useRef(null);
  const builtRef = useRef(false);
  const rowsRef = useRef(rows);
  rowsRef.current = rows;
  // Read through refs so saved prefs never force a table rebuild.
  const prefsRef = useRef(prefs);
  prefsRef.current = prefs;
  const onPrefsChangeRef = useRef(onPrefsChange);
  onPrefsChangeRef.current = onPrefsChange;
  const onRowClickRef = useRef(onRowClick);
  onRowClickRef.current = onRowClick;

  // ---- per-column filters: { [field]: {kind:'set',values:[]} | {kind:'range',min,max} }
  const [filters, setFilters] = useState({});
  const [openFilter, setOpenFilter] = useState(null);   // { field, anchor }
  const openRef = useRef(null);
  openRef.current = (field, anchor) => setOpenFilter(f => (f && f.field === field) ? null : { field, anchor });

  // A new column set (market tab) invalidates every filter.
  useEffect(() => { setFilters({}); setOpenFilter(null); }, [columns]);

  // The header's "Clear filters" button bumps filterReset → drop every filter.
  useEffect(() => {
    if (filterReset === undefined) return;
    setFilters({});
    setOpenFilter(null);
  }, [filterReset]);

  // Rows arrive as arrays (one per API row); filters work on keyed objects.
  const objects = useMemo(() => toRowObjects(columns, rows), [columns, rows]);

  // Rows after the column filters are applied. Tabulator only ever sees the
  // filtered set, so sorting / rendering stay its job.
  const filteredRows = useMemo(() => {
    const active = Object.entries(filters);
    if (!active.length) return objects;
    return objects.filter(r => active.every(([field, f]) => {
      const v = r[field];
      if (f.kind === 'set') {
        const k = (v === null || v === undefined) ? '' : String(v);
        return f.values.includes(k);
      }
      const n = Number(v);
      if (!Number.isFinite(n)) return false;
      return n >= f.min && n <= f.max;
    }));
  }, [objects, filters]);

  // Distinct values / bounds come from the rows before column filters are
  // applied, so a popup always lists every value in its column (the header
  // search still narrows the list, which is what you want).
  const filterMeta = useMemo(() => {
    const meta = {};
    for (const c of columns) {
      meta[c.key] = isNumericCol(c)
        ? { bounds: numericBounds(objects, c.key) }
        : { options: distinctValues(objects, c.key) };
    }
    return meta;
  }, [columns, objects]);

  // Keep the header buttons' active state in sync with the filter state.
  useEffect(() => {
    const host = hostRef.current;
    if (!host) return;
    host.querySelectorAll('.col-filter-btn').forEach(btn => {
      btn.classList.toggle('is-active', !!filters[btn.dataset.field]);
    });
  }, [filters, columns]);

  // Create the table once per column set (i.e. per market tab). Sorting,
  // resizing and column dragging are Tabulator features — no code needed.
  useEffect(() => {
    const el = hostRef.current;
    if (!el) return;
    builtRef.current = false;

    const p = prefsRef.current || { order: [], hidden: [] };
    const hidden = new Set(p.hidden || []);
    const defs = orderColumnDefs(toColumnDefs(columns, openRef), p.order);
    defs.forEach(d => { d.visible = !hidden.has(d.field); });

    const t = new Tabulator(el, {
      data: toRowObjects(columns, rowsRef.current),
      columns: defs,
      layout: 'fitData',          // auto-fit each column to its widest content
      height: '100%',             // fill the flex box (Tabulator sizes itself)
      movableColumns: true,       // drag headers to reorder
      placeholder: 'No matching rows',
      headerSortTristate: true,   // click cycles asc → desc → none
    });
    tableRef.current = t;

    // Nothing is safe to call until Tabulator finishes building (redraw /
    // setData before that hit internal nulls), so gate on tableBuilt.
    t.on('tableBuilt', () => {
      builtRef.current = true;
      t.setData(toRowObjects(columns, rowsRef.current));  // rows may have moved on
    });

    // Dragging a header reorders the columns → persist the new key order.
    t.on('columnMoved', () => {
      const order = t.getColumns().map(c => c.getField());
      if (onPrefsChangeRef.current) onPrefsChangeRef.current({ order });
    });

    // Clicking a row opens the ticker chart. The symbol column is the key.
    t.on('rowClick', (e, row) => {
      const d = row.getData();
      if (d && d.symbol && onRowClickRef.current) onRowClickRef.current(d.symbol);
    });

    // The table lives in a flex child, so react to container size changes
    // (Tabulator only watches the window resize by itself).
    const ro = new ResizeObserver(() => { if (builtRef.current) t.redraw(); });
    ro.observe(el);

    return () => {
      ro.disconnect();
      t.destroy();
      tableRef.current = null;
      builtRef.current = false;
    };
  }, [columns, epoch]);

  // Show/hide columns without rebuilding (keeps sort, widths and scroll).
  const hiddenKey = ((prefs && prefs.hidden) || []).join('|');
  useEffect(() => {
    const t = tableRef.current;
    if (!t || !builtRef.current) return;
    const hidden = new Set(hiddenKey ? hiddenKey.split('|') : []);
    columns.forEach(c => {
      if (hidden.has(c.key)) t.hideColumn(c.key);
      else t.showColumn(c.key);
    });
  }, [hiddenKey, columns]);

  // Reorder columns when the order changes from the Columns dropdown (header
  // drags already move the DOM themselves, so this is a no-op for them).
  const orderKey = ((prefs && prefs.order) || []).join('|');
  useEffect(() => {
    const t = tableRef.current;
    if (!t || !builtRef.current) return;
    const wanted = orderKey ? orderKey.split('|') : [];
    if (!wanted.length) return;
    const current = t.getColumns().map(c => c.getField());
    if (current.join('|') === wanted.join('|')) return;   // already in place
    // moveColumn(field, beforeField) — walk the target order and place each
    // column before the one that should follow it.
    wanted.forEach((field, i) => {
      const next = wanted[i + 1];
      if (!next) return;
      try { t.moveColumn(field, next, true); } catch { /* column hidden */ }
    });
  }, [orderKey, columns]);

  // Search + column filters only change the rows → swap data and keep sort
  // and column order.
  useEffect(() => {
    const t = tableRef.current;
    if (!t || !builtRef.current) return;   // tableBuilt handler pushes latest rows
    t.setData(filteredRows);
  }, [filteredRows, columns]);

  // ---- popup for the column whose filter button was clicked
  const openCol = openFilter ? columns.find(c => c.key === openFilter.field) : null;
  const setFilter = (field, value) => setFilters(f => {
    const next = { ...f };
    if (value) next[field] = value; else delete next[field];
    return next;
  });

  return h('div', { className: 'relative mx-5 mb-3 mt-3 min-h-0 flex-1' },
    h('div', {
      ref: hostRef,
      className: 'h-full overflow-hidden rounded-[10px] border-2 border-border',
    }),
    (openCol && filterMeta[openCol.key]) ? h(FilterPopup, {
      key: openCol.key,
      anchor: openFilter.anchor,
      title: openCol.label,
      onReset: () => setFilter(openCol.key, null),
      onClose: () => setOpenFilter(null),
    },
      isNumericCol(openCol)
        ? h(RangeFilter, {
            bounds: filterMeta[openCol.key].bounds,
            filter: filters[openCol.key],
            dec: openCol.dec,
            onChange: v => setFilter(openCol.key, v),
          })
        : h(SetFilter, {
            options: filterMeta[openCol.key].options,
            filter: filters[openCol.key],
            onChange: v => setFilter(openCol.key, v),
          })) : null);
}

/* ====================================================== column selector */
// Dropdown of checkboxes: show/hide table columns, search them, and reorder
// them by dragging. Order comes from the saved prefs (which the table also
// updates when you drag a header), so the list always mirrors the grid and
// survives a refresh via localStorage.
function ColumnSelector({ columns, prefs, onChange, onReset }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState('');
  const [dragKey, setDragKey] = useState(null);
  const [overKey, setOverKey] = useState(null);
  const boxRef = useRef(null);

  // Close on outside click / Escape.
  useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    document.addEventListener('keydown', onKey);
    return () => {
      document.removeEventListener('mousedown', onDoc);
      document.removeEventListener('keydown', onKey);
    };
  }, [open]);

  // Reset the search box whenever the menu closes.
  useEffect(() => { if (!open) { setQ(''); setDragKey(null); setOverKey(null); } }, [open]);

  const hidden = new Set(prefs.hidden || []);
  const ordered = orderColumnDefs(
    columns.map(c => ({ field: c.key, label: c.label })), prefs.order);
  const visibleCount = ordered.filter(c => !hidden.has(c.field)).length;

  const needle = q.trim().toLowerCase();
  const shown = needle
    ? ordered.filter(c => (c.label || c.field).toLowerCase().includes(needle))
    : ordered;

  const toggle = (key) => {
    const next = new Set(hidden);
    if (next.has(key)) next.delete(key);
    else if (visibleCount > 1) next.add(key);   // never hide the last column
    onChange({ hidden: [...next] });
  };

  // Move `from` so it sits where `to` currently is, then persist the full key
  // order (the same shape the table writes when a header is dragged).
  const moveColumn = (from, to) => {
    if (!from || !to || from === to) return;
    const keys = ordered.map(c => c.field);
    const fromIdx = keys.indexOf(from);
    const toIdx = keys.indexOf(to);
    if (fromIdx < 0 || toIdx < 0) return;
    keys.splice(fromIdx, 1);
    keys.splice(toIdx, 0, from);
    onChange({ order: keys });
  };

  const row = (c) => {
    const isDragging = dragKey === c.field;
    const isOver = overKey === c.field && dragKey && dragKey !== c.field;
    return h('div', {
      key: c.field,
      draggable: true,
      onDragStart: (e) => {
        setDragKey(c.field);
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', c.field); } catch { /* IE */ }
      },
      onDragOver: (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; setOverKey(c.field); },
      onDragLeave: () => setOverKey(k => (k === c.field ? null : k)),
      onDrop: (e) => {
        e.preventDefault();
        const from = dragKey || e.dataTransfer.getData('text/plain');
        moveColumn(from, c.field);
        setDragKey(null); setOverKey(null);
      },
      onDragEnd: () => { setDragKey(null); setOverKey(null); },
      className: 'col-row flex items-center gap-2 px-3 py-[5px] text-[12px] text-ink ' +
                 (isDragging ? 'is-dragging ' : '') +
                 (isOver ? 'is-over ' : ''),
    },
      h('span', { className: 'col-row-grip select-none text-[10px] text-muted', title: 'Drag to reorder' }, '⣿'),
      h('input', {
        type: 'checkbox', checked: !hidden.has(c.field),
        onChange: () => toggle(c.field),
        className: 'h-3 w-3 accent-[var(--color-accent)]',
      }),
      h('span', { className: 'truncate' }, c.label || c.field));
  };

  return h('div', { ref: boxRef, className: 'relative' },
    h('button', {
      onClick: () => setOpen(o => !o),
      title: 'Show, hide, search or reorder columns',
      className: 'flex items-center gap-2 rounded-[7px] border-2 border-border bg-[#fca5a5] px-3 py-1.5 ' +
                 'whitespace-nowrap text-[12px] font-semibold text-[#04140a] transition-colors ' +
                 'hover:bg-[#f87171]',
    },
      'Columns',
      h('span', { className: 'text-[10px] font-normal text-[#04140a]/70' }, visibleCount + '/' + ordered.length),
      h('span', { className: 'text-[9px] text-[#04140a]/70' }, open ? '▲' : '▼')),
    open ? h('div', {
      className: 'absolute right-0 top-full z-[200] mt-1 w-[250px] overflow-hidden rounded-[10px] ' +
                 'border-2 border-border bg-surface shadow-[0_12px_32px_rgba(0,0,0,.45)]',
    },
      h('div', { className: 'flex items-center justify-between border-b-2 border-border px-3 py-2' },
        h('span', { className: 'text-[11px] font-semibold text-muted' }, 'Columns'),
        h('button', {
          onClick: onReset,
          className: 'text-[11px] font-semibold text-accent transition-colors hover:text-glow',
        }, 'Reset')),
      // ---- search box
      h('div', { className: 'border-b-2 border-border px-2 py-2' },
        h('input', {
          type: 'text', value: q, onChange: e => setQ(e.target.value),
          placeholder: 'Search columns…',
          className: 'w-full rounded-[6px] border-2 border-border bg-bg px-2 py-1 text-[12px] ' +
                     'text-ink placeholder:text-muted focus:border-accent focus:outline-none',
        })),
      h('div', { className: 'max-h-[280px] overflow-y-auto py-1' },
        shown.length
          ? shown.map(row)
          : h('div', { className: 'px-3 py-2 text-[11px] text-muted' }, 'No matching columns')),
      h('div', { className: 'border-t-2 border-border px-3 py-1.5 text-[10px] text-muted' },
        'Drag ⣿ to reorder')) : null);
}
