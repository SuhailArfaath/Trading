// Everything the pickers, legend and model editor can offer.
const ALL_INDICATORS = [...TALIB_INDICATORS];

// Indicators discovered in src/indicators are listed under this group, which
// always leads the indicator menu.
const CUSTOM_GROUP = 'Custom';

// The catalogue labels embed their default parameters, e.g.
// "Simple Moving Average (30)". Strip that suffix so the label can be rebuilt
// from whatever parameters the user actually chose.
function specBaseName(spec) {
  return String(spec.label || spec.id).replace(/\s*\([^()]*\)\s*$/, '');
}

// Human label for a spec + a concrete parameter set.
function specLabel(spec, params) {
  const p = params || spec.params || {};
  const keys = spec.optOrder || [];
  // Python indicators carry many parameters, so their label stays bare.
  if (keys.length && !spec.custom) {
    return specBaseName(spec) + ' (' + keys.map(k => p[k]).join(', ') + ')';
  }
  return specBaseName(spec);
}

// The numeric parameters a user may edit inline (the first one is the period).
function specNumericKeys(spec) {
  // Python indicators carry many parameters; editing them inline would
  // overflow the row, so they keep their defaults.
  if (spec.custom) return [];
  return (spec.optOrder || []).filter(k => typeof (spec.params || {})[k] === 'number');
}

// Map a catalogue entry's `inputs` to the OHLCV arrays we have. `inPeriods`
// (used only by MAVP) is synthesised as a constant period series.
const TALIB_INPUT_MAP = {
  inReal: 'close', inReal0: 'close', inReal1: 'close',
  open: 'open', high: 'high', low: 'low', close: 'close', volume: 'volume',
};

// talib-web's wrapper never reads outBegIdx/outNbElement, so its returned
// arrays are full-length with uninitialised zeros at the front and the real
// values left-aligned (values[i] is the indicator at input index i + lookback).
//
// Rather than hardcoding a lookback per function (161 of them, and it changes
// with every period option), ask the C library directly: call the raw WASM
// entry point with outBegIdx/outNbElement pointers and read them back. That is
// exact, and it also yields a correctly aligned output array.
//
// Results are memoised per (id + params + the actual input series).
const TALIB_LOOKBACK_CACHE = new Map();
const TALIB_CACHE_MAX = 600;

// Cheap FNV-1a over the source arrays. The memo is keyed on this so a different
// ticker (or interval) that happens to have the same bar count can never reuse
// another series' indicator output — that used to leave stale overlays and
// panes on screen after switching tickers.
function srcFingerprint(src, n) {
  let h = 2166136261;
  const close = src.close || [];
  const vol = src.volume || [];
  for (let i = 0; i < n; i++) {
    h ^= (Math.round((close[i] || 0) * 1000) | 0);
    h = Math.imul(h, 16777619);
    h ^= (Math.round((vol[i] || 0) * 1000) | 0);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(36);
}

function talibRaw(spec, src, n) {
  // The result depends on the bar count AND the input values, so both are in
  // the key.
  const key = spec.id + '|' + n + '|' + srcFingerprint(src, n) + '|' +
              JSON.stringify(spec.params || {});
  if (TALIB_LOOKBACK_CACHE.has(key)) return TALIB_LOOKBACK_CACHE.get(key);

  const M = window.__TA_WASM;
  const fnName = 'TA_' + spec.id;
  // Emscripten exports the C symbol with a leading underscore (_TA_RSI), while
  // ccall() takes the unprefixed name. Not ready yet — return null WITHOUT
  // caching, so a later attempt can succeed.
  if (!M || typeof M.ccall !== 'function' || typeof M['_' + fnName] !== 'function') return null;

  const dbl = (size) => {
    const off = M._malloc(Math.max(1, size) * 8);
    return { off, data: M.HEAPF64.subarray(off / 8, off / 8 + Math.max(1, size)) };
  };
  const int = () => {
    const off = M._malloc(4);
    return { off, data: M.HEAP32.subarray(off / 4, off / 4 + 1) };
  };

  const allocs = [];
  let result = null;
  try {
    const inPtrs = spec.inputs.map(k => {
      const arr = src[TALIB_INPUT_MAP[k] || k] || [];
      const buf = dbl(n);
      allocs.push(buf);
      for (let i = 0; i < n; i++) buf.data[i] = arr[i] || 0;
      return buf.off;
    });

    const optVals = (spec.optOrder || []).map(k => (spec.params || {})[k] || 0);

    const beg = int(), cnt = int();
    allocs.push(beg, cnt);

    const outBufs = (spec.outs || [spec.out]).map(() => {
      const b = dbl(n);
      allocs.push(b);
      return b;
    });

    const args = [0, n - 1, ...inPtrs, ...optVals, beg.off, cnt.off,
                  ...outBufs.map(b => b.off)];
    const rc = M.ccall(fnName, 'number', new Array(args.length).fill('number'), args);
    if (rc !== 0) return null;

    const begIdx = beg.data[0];
    const nb = cnt.data[0];
    const outs = {};
    (spec.outs || [spec.out]).forEach((name, i) => {
      outs[name] = Array.from(outBufs[i].data.subarray(0, nb));
    });
    result = { begIdx, nb, outs };
  } catch (e) {
    result = null;
  } finally {
    allocs.forEach(a => M._free(a.off));
  }

  // Keep the memo bounded: every ticker/interval adds new keys.
  if (TALIB_LOOKBACK_CACHE.size >= TALIB_CACHE_MAX) TALIB_LOOKBACK_CACHE.clear();
  TALIB_LOOKBACK_CACHE.set(key, result);
  return result;
}

// Dev hook: lets the browser console (and automated checks) exercise the
// indicator pipeline directly. Harmless in production.
window.__TALIB_DEBUG = {
  talibRaw, TALIB_INDICATORS, ALL_INDICATORS, TALIB_INPUT_MAP,
};

// Pair an aligned output array (already trimmed to outNbElement) with the bar
// times, starting at outBegIdx.
function talibSeries(times, values, begIdx) {
  const out = [];
  const start = begIdx || 0;
  for (let i = 0; i < values.length; i++) {
    const t = times[start + i];
    if (t === undefined) break;
    const v = values[i];
    if (v === null || v === undefined || Number.isNaN(v)) continue;
    out.push({ time: t, value: v });
  }
  return out;
}

/* ---------------------------------------------------------------- models */
// A "model" is a named set of indicator conditions plus a highlight colour.
// A bar belongs to a model's zone only when EVERY condition holds on that bar.
// Conditions are evaluated through the same raw WASM path the panes use, so
// what the chart draws and what the model tests can never drift apart.
//
// Every condition is a RANGE [lo, hi] plus an operator that says how the range
// is applied. The dual-handle slider and the number boxes edit the same two
// numbers, so either input method works.
const MODEL_OPS = [
  { id: 'gte', label: '\u2265', handles: 'lo', title: 'value \u2265 low bound',
    fn: (v, lo) => v >= lo },
  { id: 'lte', label: '\u2264', handles: 'hi', title: 'value \u2264 high bound',
    fn: (v, lo, hi) => v <= hi },
  { id: 'gt', label: '>', handles: 'lo', title: 'value > low bound',
    fn: (v, lo) => v > lo },
  { id: 'lt', label: '<', handles: 'hi', title: 'value < high bound',
    fn: (v, lo, hi) => v < hi },
  { id: 'eq', label: '=', handles: 'lo', title: 'value = low bound',
    fn: (v, lo) => Math.abs(v - lo) < 1e-9 },
  { id: 'neq', label: '\u2260', handles: 'lo', title: 'value \u2260 low bound',
    fn: (v, lo) => Math.abs(v - lo) >= 1e-9 },
  { id: 'between', label: '\u2208', handles: 'both', title: 'low \u2264 value \u2264 high',
    fn: (v, lo, hi) => v >= lo && v <= hi },
  { id: 'outside', label: '\u2209', handles: 'both', title: 'value < low or value > high',
    fn: (v, lo, hi) => v < lo || v > hi },
];

// Ten predefined highlight colours. The chosen one tints the model's zones and
// its slider handles, so several models can be on screen at once and still be
// told apart.
const MODEL_COLORS = [
  '#00cc44', '#00bcd4', '#2196f3', '#5c6bc0', '#9c27b0',
  '#e91e63', '#ef5350', '#ff9800', '#ffc107', '#26a69a',
];
const DEFAULT_MODEL_COLOR = MODEL_COLORS[0];

// '#rrggbb' -> 'rgba(r, g, b, a)' for the translucent zone fills.
function hexA(hex, a) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ''));
  if (!m) return 'rgba(0, 204, 68, ' + a + ')';
  const n = parseInt(m[1], 16);
  return 'rgba(' + ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' +
         (n & 255) + ', ' + a + ')';
}

const MODELS_STORE_KEY = 'trading.models.v2';
const MODELS_STORE_KEY_V1 = 'trading.models.v1';
const MAX_CONDITIONS = 10;

// v1 stored a single `value` per condition and no colour. Fold those into the
// range shape so nobody loses the models they already built.
function migrateModel(m, i) {
  const conditions = (m.conditions || []).map(c => {
    const lo = c.lo !== undefined ? c.lo : c.value;
    const hi = c.hi !== undefined ? c.hi : c.value;
    return {
      indicatorId: c.indicatorId || '',
      period: c.period === undefined || c.period === null ? '' : c.period,
      op: MODEL_OPS.some(o => o.id === c.op) ? c.op : 'gte',
      lo: lo === undefined || lo === null ? '' : lo,
      hi: hi === undefined || hi === null ? '' : hi,
    };
  });
  return {
    id: m.id || 'm' + i,
    name: m.name || 'Model ' + (i + 1),
    color: MODEL_COLORS.includes(m.color) ? m.color : MODEL_COLORS[i % MODEL_COLORS.length],
    conditions,
    createdAt: m.createdAt || new Date().toISOString(),
  };
}

function loadModels() {
  try {
    const raw = localStorage.getItem(MODELS_STORE_KEY);
    if (raw) {
      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr.map(migrateModel) : [];
    }
    // First run after the upgrade: adopt any v1 models.
    const old = localStorage.getItem(MODELS_STORE_KEY_V1);
    const arr = old ? JSON.parse(old) : [];
    return Array.isArray(arr) ? arr.map(migrateModel) : [];
  } catch { return []; }
}

function saveModels(models) {
  try { localStorage.setItem(MODELS_STORE_KEY, JSON.stringify(models)); } catch {}
}

// A condition is only usable once an indicator is picked AND the bound(s) that
// its operator reads have been typed.
function condValid(c) {
  if (!c || !c.indicatorId) return false;
  const op = MODEL_OPS.find(o => o.id === c.op) || MODEL_OPS[0];
  const lo = Number(c.lo);
  const hi = Number(c.hi);
  if (op.handles === 'lo' || op.handles === 'both') {
    if (c.lo === '' || c.lo === null || !Number.isFinite(lo)) return false;
  }
  if (op.handles === 'hi' || op.handles === 'both') {
    if (c.hi === '' || c.hi === null || !Number.isFinite(hi)) return false;
  }
  return true;
}

// First palette colour not already taken, so new models look distinct.
function nextModelColor(models) {
  const used = new Set((models || []).map(m => m.color));
  return MODEL_COLORS.find(c => !used.has(c)) ||
         MODEL_COLORS[(models || []).length % MODEL_COLORS.length];
}

// Build the OHLCV source arrays once per evaluation (mirrors the chart build).
function modelSource(candles, volume) {
  const times = candles.map(c => c.time);
  const volByTime = new Map((volume || []).map(v => [v.time, v.value]));
  return {
    times,
    src: {
      open: candles.map(c => c.open),
      high: candles.map(c => c.high),
      low: candles.map(c => c.low),
      close: candles.map(c => c.close),
      volume: times.map(t => volByTime.get(t) || 0),
      inPeriods: times.map(() => 30),
    },
  };
}

// Contiguous runs of bars where every condition is true. Returns
// [{ from, to, bars }] using bar times, ready for timeToCoordinate().
function computeModelRuns(model, candles, volume) {
  if (!model || !model.conditions || !model.conditions.length) return [];
  const { times, src } = modelSource(candles, volume);
  const n = times.length;
  if (!n) return [];

  const masks = [];
  for (const cond of model.conditions) {
    if (!condValid(cond)) return [];
    const base = ALL_INDICATORS.find(s => s.id === cond.indicatorId);
    if (!base) return [];

    // Override the indicator's first tunable parameter with the typed period.
    const params = { ...(base.params || {}) };
    const firstKey = (base.optOrder || [])[0];
    const period = Number(cond.period);
    if (firstKey && Number.isFinite(period) && period > 0) params[firstKey] = period;

    const res = talibRaw({ ...base, params }, src, n);
    if (!res) return [];

    const outKey = cond.out || base.out || (base.outs || [])[0];
    const vals = res.outs[outKey];
    if (!vals) return [];

    const byTime = new Map(talibSeries(times, vals, res.begIdx).map(p => [p.time, p.value]));
    const op = (MODEL_OPS.find(o => o.id === cond.op) || MODEL_OPS[0]).fn;
    // Number('') is 0, so test for an empty bound explicitly before coercing.
    const toNum = (v, fb) => (v === '' || v === null || v === undefined ||
                              !Number.isFinite(Number(v))) ? fb : Number(v);
    const lo = toNum(cond.lo, 0);
    const hi = toNum(cond.hi, lo);

    const mask = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      const v = byTime.get(times[i]);
      mask[i] = v !== undefined && op(v, lo, hi) ? 1 : 0;
    }
    masks.push(mask);
  }

  const color = model.color || DEFAULT_MODEL_COLOR;
  const runs = [];
  let start = -1;
  for (let i = 0; i < n; i++) {
    const ok = masks.every(m => m[i] === 1);
    if (ok && start < 0) start = i;
    if (start >= 0 && (!ok || i === n - 1)) {
      const end = ok ? i : i - 1;
      runs.push({ from: times[start], to: times[end], bars: end - start + 1, color });
      start = -1;
    }
  }
  return runs;
}

// Min/max of a condition's indicator series over the visible candles. Gives the
// dual-handle slider a span that actually brackets the data, instead of an
// arbitrary 0..100. Returns null until an indicator is picked.
function condValueRange(cond, candles, volume) {
  if (!cond || !cond.indicatorId || !candles || !candles.length) return null;
  const base = ALL_INDICATORS.find(s => s.id === cond.indicatorId);
  if (!base) return null;

  const { times, src } = modelSource(candles, volume);
  const n = times.length;
  if (!n) return null;

  const params = { ...(base.params || {}) };
  const firstKey = (base.optOrder || [])[0];
  const period = Number(cond.period);
  if (firstKey && Number.isFinite(period) && period > 0) params[firstKey] = period;

  const res = talibRaw({ ...base, params }, src, n);
  if (!res) return null;
  const outKey = cond.out || base.out || (base.outs || [])[0];
  const vals = res.outs[outKey];
  if (!vals) return null;

  let min = Infinity, max = -Infinity;
  for (const v of vals) {
    if (!Number.isFinite(v)) continue;
    if (v < min) min = v;
    if (v > max) max = v;
  }
  if (!Number.isFinite(min) || !Number.isFinite(max)) return null;
  if (min === max) { min -= 1; max += 1; }
  return { min, max };
}

// Series primitive that paints a translucent band behind the candles for each
// satisfied run, tinted with the owning model's colour. Attached to the price
// series, so it lives in pane 0. Runs from several models can be on screen at
// once; each carries its own colour.
function makeZonePrimitive(getRuns, timeScale) {
  return {
    paneViews() {
      return [{
        // v5 expects a method, not a string property.
        zOrder: () => 'bottom',
        renderer: () => ({
          draw(target) {
            const runs = getRuns();
            if (!runs || !runs.length || !timeScale) return;
            target.useMediaCoordinateSpace(({ context: ctx, mediaSize }) => {
              ctx.save();
              for (const run of runs) {
                const x1 = timeScale.timeToCoordinate(run.from);
                const x2 = timeScale.timeToCoordinate(run.to);
                if (x1 == null || x2 == null) continue;
                const w = Math.max(2, x2 - x1);
                const color = run.color || DEFAULT_MODEL_COLOR;
                ctx.fillStyle = hexA(color, 0.16);
                ctx.fillRect(x1, 0, w, mediaSize.height);
                ctx.strokeStyle = hexA(color, 0.55);
                ctx.lineWidth = 1;
                ctx.strokeRect(x1 + 0.5, 0.5, Math.max(1, w - 1), mediaSize.height - 1);
              }
              ctx.restore();
            });
          },
        }),
      }];
    },
  };
}

// Series primitive that shades LuxAlgo's three premium/discount bands behind
// the candles. Attached to the price series so it lives in pane 0.
//
// LuxAlgo draws each zone as ONE box spanning from the pivot bar
// (`trailing.barTime`) to the last bar — a flat horizontal band, not a stepped
// per-bar ribbon. The bands therefore only change when a new swing pivot
// resets the range, which is exactly what the reference chart shows.
//
// `getBands()` returns:
//   premiumTop / premiumBottom   the premium band
//   eqTop / eqBottom             the equilibrium band
//   discountTop / discountBottom the discount band
//   anchorTime                   bar time the current range starts at
//
// Price -> y conversion goes through the SERIES, not the price scale: v5's
// IPriceScaleApi has no priceToCoordinate(), only ISeriesApi does.
function makeBandPrimitive(getBands, timeScale, series, palette) {
  // [topKey, bottomKey, defaultFill, label, defaultColor, align]
  // LuxAlgo centres the premium/discount labels on the box (label_down /
  // label_up at the midpoint bar) and pins equilibrium to the right edge
  // (label_left at the last bar). Matching that keeps "Premium" from colliding
  // with the "Weak High" label drawn at the right edge.
  const BANDS = [
    ['premiumTop', 'premiumBottom', 'rgba(242, 54, 69, 0.20)', 'Premium', '#f23645', 'center'],
    ['eqTop', 'eqBottom', 'rgba(135, 139, 148, 0.20)', 'Equilibrium', '#878b94', 'right'],
    ['discountTop', 'discountBottom', 'rgba(8, 153, 129, 0.20)', 'Discount', '#089981', 'center'],
  ];
  // Optional per-indicator palette: { premium: '#hex', equilibrium: '#hex',
  // discount: '#hex' }. Smart Money uses the purple/grey/blue scheme from the
  // reference chart; without a palette LuxAlgo's red/grey/green defaults apply.
  const pal = palette || {};

  return {
    paneViews() {
      return [{
        zOrder: () => 'bottom',
        renderer: () => ({
          draw(target) {
            const bands = getBands();
            if (!bands || !timeScale || !series) return;
            const ref = bands.premiumTop;
            if (!ref || !ref.length) return;

            // The range is constant between pivots, so only the LAST point
            // matters: it holds the current top/bottom.
            const last = ref.length - 1;

            target.useMediaCoordinateSpace(({ context: ctx, mediaSize }) => {
              ctx.save();
              const right = mediaSize.width;

              // LuxAlgo anchors each zone box at the pivot bar and labels it at
              // the midpoint between that bar and the last one.
              const anchors = bands.anchorTime || [];
              const anchorT = anchors[last];
              const xAnchor = anchorT == null ? null : timeScale.timeToCoordinate(anchorT);
              // The box starts at the anchor bar (left edge only when the
              // anchor is scrolled out of view).
              const x0 = xAnchor == null ? 0 : Math.max(0, xAnchor);
              const midX = (x0 + right) / 2;

              for (const [topKey, botKey, defFill, label, defColor, align] of BANDS) {
                const tops = bands[topKey], bots = bands[botKey];
                if (!tops || !bots || !tops[last] || !bots[last]) continue;

                const yTop = series.priceToCoordinate(tops[last].value);
                const yBot = series.priceToCoordinate(bots[last].value);
                if (yTop == null || yBot == null) continue;

                const key = label.toLowerCase();
                const color = pal[key] || defColor;
                const fill = pal[key] ? hexA(pal[key], 0.20) : defFill;

                const h = Math.max(1, yBot - yTop);
                ctx.fillStyle = fill;
                ctx.fillRect(x0, yTop, right - x0, h);

                // Zone name: centred on the box for premium/discount,
                // right-aligned for equilibrium (mirrors LuxAlgo's styles).
                ctx.fillStyle = color;
                ctx.font = '11px ui-monospace, SFMono-Regular, Menlo, monospace';
                ctx.textAlign = align;
                ctx.textBaseline = 'middle';
                ctx.fillText(label, align === 'center' ? midX : right - 8, yTop + h / 2);
              }
              ctx.restore();
            });
          },
        }),
      }];
    },
  };
}

// Series primitive that paints the Smart Money Concepts overlays behind the
// candles: order blocks, BOS/CHoCH structure lines, EQH/EQL, and the
// strong/weak high & low trailing levels. The premium/equilibrium/discount
// bands are drawn by makeBandPrimitive.
function makeSmartMoneyPrimitive(getData, timeScale, series) {
  return {
    paneViews() {
      return [{
        zOrder: () => 'bottom',
        renderer: () => ({
          draw(target) {
            const d = getData();
            if (!d || !timeScale || !series) return;
            target.useMediaCoordinateSpace(({ context: ctx, mediaSize }) => {
              ctx.save();
              const right = mediaSize.width;
              const xOf = (t) => timeScale.timeToCoordinate(t);
              const yOf = (p) => series.priceToCoordinate(p);

              // ---- order blocks (translucent boxes extending right)
              for (const ob of d.orderBlocks || []) {
                const x1 = xOf(ob.fromTime);
                const yT = yOf(ob.top), yB = yOf(ob.bottom);
                if (x1 == null || yT == null || yB == null) continue;
                ctx.fillStyle = ob.bias === 1
                  ? (ob.internal ? 'rgba(49,121,245,0.22)' : 'rgba(24,72,204,0.22)')
                  : (ob.internal ? 'rgba(247,124,128,0.22)' : 'rgba(178,40,51,0.22)');
                ctx.fillRect(x1, yT, Math.max(1, right - x1), Math.max(1, yB - yT));
              }

              ctx.font = '10px ui-monospace, SFMono-Regular, Menlo, monospace';

              // ---- structure breaks (BOS / CHoCH)
              for (const b of d.structure || []) {
                const x1 = xOf(b.fromTime), x2 = xOf(b.time);
                const y = yOf(b.price);
                if (x1 == null || x2 == null || y == null) continue;
                const color = b.bias === 1 ? '#089981' : '#f23645';
                ctx.strokeStyle = color;
                ctx.lineWidth = 1;
                ctx.setLineDash(b.internal ? [3, 3] : []);
                ctx.beginPath();
                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = color;
                ctx.textAlign = 'center';
                ctx.textBaseline = b.bias === 1 ? 'bottom' : 'top';
                ctx.fillText(b.tag, (x1 + x2) / 2, b.bias === 1 ? y - 2 : y + 2);
              }

              // ---- equal highs / equal lows
              const drawEqual = (list, color, above) => {
                for (const e of list || []) {
                  const x1 = xOf(e.fromTime), x2 = xOf(e.toTime);
                  const y = yOf(e.price);
                  if (x1 == null || x2 == null || y == null) continue;
                  ctx.strokeStyle = color;
                  ctx.lineWidth = 1;
                  ctx.setLineDash([2, 2]);
                  ctx.beginPath();
                  ctx.moveTo(x1, y);
                  ctx.lineTo(x2, y);
                  ctx.stroke();
                  ctx.setLineDash([]);
                  ctx.fillStyle = color;
                  ctx.textAlign = 'center';
                  ctx.textBaseline = above ? 'bottom' : 'top';
                  ctx.fillText(e.tag, (x1 + x2) / 2, above ? y - 2 : y + 2);
                }
              };
              drawEqual(d.equalHighs, '#f23645', true);
              drawEqual(d.equalLows, '#089981', false);

              // ---- strong / weak high & low
              const sw = d.strongWeak;
              if (sw && sw.top != null && sw.bottom != null) {
                const yT = yOf(sw.top), yB = yOf(sw.bottom);
                const xT = xOf(sw.topTime), xB = xOf(sw.bottomTime);
                if (yT != null) {
                  ctx.strokeStyle = '#f23645';
                  ctx.lineWidth = 1;
                  ctx.setLineDash([]);
                  ctx.beginPath();
                  ctx.moveTo(xT == null ? 0 : xT, yT);
                  ctx.lineTo(right, yT);
                  ctx.stroke();
                  ctx.fillStyle = '#f23645';
                  ctx.textAlign = 'right';
                  ctx.textBaseline = 'bottom';
                  ctx.fillText(sw.topLabel, right - 4, yT - 2);
                }
                if (yB != null) {
                  ctx.strokeStyle = '#089981';
                  ctx.lineWidth = 1;
                  ctx.beginPath();
                  ctx.moveTo(xB == null ? 0 : xB, yB);
                  ctx.lineTo(right, yB);
                  ctx.stroke();
                  ctx.fillStyle = '#089981';
                  ctx.textAlign = 'right';
                  ctx.textBaseline = 'top';
                  ctx.fillText(sw.bottomLabel, right - 4, yB + 2);
                }
              }

              ctx.restore();
            });
          },
        }),
      }];
    },
  };
}

/* ------------------------------------------------------- ticker switcher */
// Search box that replaces the static symbol in the chart header. Typing
// filters the market's scan universe by symbol OR company name; picking a row
// swaps the chart's data while leaving the indicator selection (and any active
// model) untouched, because those live in ChartModal state and never reset.
function TickerSearch({ symbol, universe, onPick }) {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState('');
  const [hi, setHi] = useState(0);
  const wrapRef = useRef(null);
  const inputRef = useRef(null);

  // Rank matches so an exact symbol beats a prefix, which beats a substring.
  const matches = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return universe.slice(0, 12);
    const scored = [];
    for (const u of universe) {
      const s = (u.symbol || '').toLowerCase();
      const n = (u.name || '').toLowerCase();
      let rank = -1;
      if (s === q) rank = 0;
      else if (s.startsWith(q)) rank = 1;
      else if (n.startsWith(q)) rank = 2;
      else if (s.includes(q)) rank = 3;
      else if (n.includes(q)) rank = 4;
      if (rank >= 0) scored.push({ u, rank });
    }
    scored.sort((a, b) => a.rank - b.rank);
    return scored.slice(0, 12).map(x => x.u);
  }, [query, universe]);

  // Close on an outside click and drop the query so the next open starts clean.
  useEffect(() => {
    if (!open) return;
    const onDown = (e) => {
      const el = wrapRef.current;
      if (el && !el.contains(e.target)) { setOpen(false); setQuery(''); }
    };
    document.addEventListener('mousedown', onDown);
    return () => document.removeEventListener('mousedown', onDown);
  }, [open]);

  const close = () => {
    setOpen(false);
    setQuery('');
    if (inputRef.current) inputRef.current.blur();
  };

  const pick = (u) => {
    if (!u) return close();
    close();
    if (u.symbol !== symbol) onPick(u.symbol);
  };

  const onKeyDown = (e) => {
    if (e.key === 'Escape') {
      // Close only the dropdown — the chart modal's own Escape handler must not
      // also fire, or the whole chart would disappear.
      e.stopPropagation();
      e.preventDefault();
      close();
      return;
    }
    if (!open) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      setHi(i => Math.min(i + 1, Math.max(0, matches.length - 1)));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      setHi(i => Math.max(i - 1, 0));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      pick(matches[hi]);
    }
  };

  return h('div', { ref: wrapRef, className: 'relative' },
    h('div', { className: 'flex items-center gap-1' },
      h('input', {
        ref: inputRef,
        type: 'text',
        value: open ? query : symbol,
        placeholder: 'Search symbol or name\u2026',
        onFocus: () => { setOpen(true); setQuery(''); setHi(0); },
        onChange: (e) => { setQuery(e.target.value); setHi(0); },
        onKeyDown,
        spellCheck: false,
        autoComplete: 'off',
        title: 'Search and switch ticker',
        className: 'w-[200px] rounded-[6px] border-2 border-border bg-bg px-2 py-0.5 ' +
                   'font-mono text-[15px] font-bold text-ink ' +
                   'placeholder:font-sans placeholder:text-[12px] placeholder:font-normal ' +
                   'placeholder:text-muted focus:border-accent focus:outline-none',
      })),
    open ? h('div', {
      className: 'absolute left-0 top-full z-[320] mt-1 flex max-h-[60vh] w-[400px] ' +
                 'flex-col overflow-hidden rounded-[8px] border-2 border-border bg-surface ' +
                 'shadow-[0_12px_32px_rgba(0,0,0,.5)]',
    },
      h('div', {
        className: 'shrink-0 border-b border-border/40 px-3 py-1.5 text-[10px] ' +
                   'font-semibold uppercase tracking-wide text-muted',
      }, query.trim()
        ? matches.length + ' match' + (matches.length === 1 ? '' : 'es')
        : 'Type to search ' + universe.length + ' tickers'),
      h('div', { className: 'min-h-0 flex-1 overflow-y-auto' },
        matches.length
          ? matches.map((u, i) => h('button', {
              key: u.symbol,
              // Keep focus in the input so the outside-click handler never sees
              // a blur before the click lands.
              onMouseDown: (e) => e.preventDefault(),
              onClick: () => pick(u),
              onMouseEnter: () => setHi(i),
              className: 'flex w-full items-center gap-2 px-3 py-1.5 text-left ' +
                         'transition-colors ' +
                         (i === hi ? 'bg-accent/15' : 'hover:bg-accent/10'),
            },
              h('span', { className: 'w-[64px] shrink-0 font-mono text-[12px] font-bold text-ink' },
                u.symbol),
              h('span', { className: 'min-w-0 flex-1 truncate text-[11px] text-muted' }, u.name),
              u.price != null ? h('span', { className: 'shrink-0 font-mono text-[11px] text-ink' },
                Number(u.price).toFixed(2)) : null,
              u.chg != null ? h('span', {
                className: 'w-[54px] shrink-0 text-right font-mono text-[11px] font-semibold ' +
                           (Number(u.chg) >= 0 ? 'text-accent' : 'text-[#ef4444]'),
              }, (Number(u.chg) >= 0 ? '+' : '') + Number(u.chg).toFixed(2) + '%') : null))
          : h('div', { className: 'px-3 py-3 text-[11px] text-muted' }, 'No matching tickers')))
      : null);
}

/* ------------------------------------------------- model condition editor */
// Dual-handle range slider. Both handles edit the same [lo, hi] pair the number
// boxes edit, so the user can drive a condition with either input method.
// `loActive` / `hiActive` dim the handle an operator does not read (e.g. `>`
// only looks at the low bound).
function DualRange({ min, max, lo, hi, step, color, loActive, hiActive, onChange }) {
  const span = max - min;
  const pct = (v) => (span > 0 ? ((v - min) / span) * 100 : 0);
  const clamp = (v) => Math.max(min, Math.min(max, v));

  const setLo = (v) => {
    const n = clamp(Number(v));
    if (Number.isFinite(n)) onChange(Math.min(n, hi), hi);
  };
  const setHi = (v) => {
    const n = clamp(Number(v));
    if (Number.isFinite(n)) onChange(lo, Math.max(n, lo));
  };

  return h('div', {
    className: 'dual-range',
    // Tints the fill and both thumbs with the model's highlight colour.
    style: { '--slider-color': color },
  },
    h('div', { className: 'track' }),
    h('div', { className: 'fill', style: { left: pct(lo) + '%', right: (100 - pct(hi)) + '%' } }),
    h('input', {
      type: 'range', min, max, step, value: lo,
      onChange: (e) => setLo(e.target.value),
      title: 'Low bound',
      style: loActive ? undefined : { opacity: 0.3 },
    }),
    h('input', {
      type: 'range', min, max, step, value: hi,
      onChange: (e) => setHi(e.target.value),
      title: 'High bound',
      style: hiActive ? undefined : { opacity: 0.3 },
    }));
}

// One condition inside the model editor: indicator + period + operator on the
// first line, the two range boxes on the second, and the dual-handle slider
// underneath. The slider span is taken from the indicator's own min/max over
// the visible bars, so the handles start out bracketing the real data.
function ModelConditionRow({ cond, groups, candles, volume, color, onChange, onRemove }) {
  const op = MODEL_OPS.find(o => o.id === cond.op) || MODEL_OPS[0];

  const num = (v, fb) => {
    const n = Number(v);
    return (v === '' || v === null || v === undefined || !Number.isFinite(n)) ? fb : n;
  };

  // Span the slider over the indicator's own min/max, widened to include any
  // value the user typed, so a handle never sits pinned at an edge.
  const bounds = useMemo(() => {
    const r = condValueRange(cond, candles, volume);
    let min = r ? r.min : 0;
    let max = r ? r.max : 100;
    const typedLo = num(cond.lo, NaN);
    const typedHi = num(cond.hi, NaN);
    if (Number.isFinite(typedLo)) { min = Math.min(min, typedLo); max = Math.max(max, typedLo); }
    if (Number.isFinite(typedHi)) { min = Math.min(min, typedHi); max = Math.max(max, typedHi); }
    if (!(max > min)) { min -= 1; max += 1; }
    const pad = (max - min) * 0.05;
    return { min: min - pad, max: max + pad };
  }, [cond.indicatorId, cond.period, cond.lo, cond.hi, candles, volume]);

  const span = bounds.max - bounds.min;
  const step = span > 0 ? Math.max(span / 400, 0.0001) : 1;

  // Round to a precision that suits the span. A fixed 2 decimals would collapse
  // the range of small-valued indicators (ROCP, BOP, ...) to a single number.
  const round = (v) => {
    const digits = span >= 100 ? 2 : span >= 1 ? 3 : span >= 0.01 ? 5 : 8;
    const f = Math.pow(10, digits);
    return Math.round(v * f) / f;
  };

  const loV = Math.max(bounds.min, Math.min(num(cond.lo, bounds.min), bounds.max));
  const hiV = Math.max(bounds.min, Math.min(num(cond.hi, bounds.max), bounds.max));

  // Picking an indicator seeds the range with that indicator's actual span.
  const pickIndicator = (id) => {
    const patch = { indicatorId: id };
    const r = condValueRange({ ...cond, indicatorId: id }, candles, volume);
    if (r) {
      patch.lo = round(r.min);
      patch.hi = round(r.max);
    }
    onChange(patch);
  };

  // Keep the pair ordered: dragging one handle past the other swaps them
  // instead of producing an inverted (never-true) range.
  const setRange = (lo, hi) => onChange({
    lo: round(Math.min(lo, hi)),
    hi: round(Math.max(lo, hi)),
  });

  const loActive = op.handles === 'lo' || op.handles === 'both';
  const hiActive = op.handles === 'hi' || op.handles === 'both';

  const box = (key, active, title) => h('input', {
    type: 'text', inputMode: 'decimal', value: cond[key],
    placeholder: key === 'lo' ? 'low' : 'high',
    onChange: (e) => onChange({ [key]: e.target.value }),
    title,
    className: 'w-[92px] shrink-0 rounded-[5px] border bg-transparent px-2 py-2 ' +
               'text-center font-mono text-[12px] text-ink outline-none ' +
               'placeholder:text-muted focus:border-accent ' +
               (active ? 'border-border/40' : 'border-border/20 opacity-50'),
  });

  return h('div', {
    className: 'mb-3 rounded-[7px] border border-border/30 px-3 py-2.5',
  },
    h('div', { className: 'flex items-center gap-2' },
      h('select', {
        value: cond.indicatorId,
        onChange: (e) => pickIndicator(e.target.value),
        title: 'Indicator',
        className: 'min-w-0 flex-1 rounded-[5px] border border-border/40 bg-surface ' +
                   'px-2 py-2 font-mono text-[12px] text-ink outline-none ' +
                   'focus:border-accent',
      },
        h('option', { value: '' }, 'Select indicator…'),
        groups.map(([group, specs]) => h('optgroup', { key: group, label: group },
          specs.map(s => h('option', { key: s.id, value: s.id }, s.label))))),
      // Plain text box on purpose: a number input draws the browser's native
      // up/down spinners, which step by 1 and clash with the theme.
      h('input', {
        type: 'text', inputMode: 'numeric', value: cond.period, placeholder: 'per',
        onChange: (e) => onChange({ period: e.target.value }),
        title: 'Indicator period',
        className: 'w-16 shrink-0 rounded-[5px] border border-border/40 bg-transparent ' +
                   'px-1 py-2 text-center font-mono text-[12px] text-ink outline-none ' +
                   'placeholder:text-muted focus:border-accent',
      }),
      h('select', {
        value: cond.op,
        onChange: (e) => onChange({ op: e.target.value }),
        title: 'Comparison operator',
        className: 'w-16 shrink-0 rounded-[5px] border border-border/40 bg-surface ' +
                   'px-1 py-2 text-center font-mono text-[13px] text-ink outline-none ' +
                   'focus:border-accent',
      }, MODEL_OPS.map(o => h('option', { key: o.id, value: o.id, title: o.title }, o.label))),
      h('button', {
        onClick: onRemove, title: 'Remove condition',
        className: 'shrink-0 rounded-[4px] border border-[#e57373] bg-[#ffcdd2] px-2 py-1 ' +
                   'text-[12px] font-bold leading-none text-[#7f1d1d] ' +
                   'transition-colors hover:bg-[#ef9a9a] hover:border-[#d32f2f]',
      }, '✕')),
    h('div', { className: 'mt-2.5 flex items-center gap-2' },
      box('lo', loActive, 'Low bound'),
      h('span', { className: 'shrink-0 text-[12px] text-muted' }, '–'),
      box('hi', hiActive, 'High bound'),
      h('span', { className: 'ml-auto min-w-0 truncate text-right font-mono text-[11px] text-muted' },
        op.title)),
    h(DualRange, {
      min: bounds.min, max: bounds.max, step,
      lo: loV, hi: hiV, color, loActive, hiActive,
      onChange: setRange,
    }));
}

// Compact one-line rendering of a saved condition, for the model list.
function condText(c) {
  const op = MODEL_OPS.find(o => o.id === c.op) || MODEL_OPS[0];
  if (op.handles === 'both') return c.lo + ' … ' + c.hi;
  if (op.handles === 'hi') return String(c.hi);
  return String(c.lo);
}

function ChartModal({ symbol, market, currency, dark, active, setActive,
                      onClose, onSymbolChange }) {
  const boxRef = useRef(null);
  const chartRef = useRef(null);
  const menuRef = useRef(null);
  // The ticker being charted. Starts at the row that opened the modal and is
  // swapped in place by the header search box.
  const [sym, setSym] = useState(symbol);
  const [universe, setUniverse] = useState([]);   // [{symbol,name,price,chg}]
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(true);
  const [period, setPeriod] = useState('1Y');
  const [interval, setInterval] = useState('1D');
  // Applied indicators: [{ key, id, params }]. `key` is unique per instance so
  // the same function can be added twice with different periods (EMA 5 and
  // EMA 20 side by side). `params` overrides the catalogue defaults.
  const [menuOpen, setMenuOpen] = useState(false);
  const [menuQuery, setMenuQuery] = useState('');
  const [talibReady, setTalibReady] = useState(false);

  // ---- Python indicators discovered in src/indicators (served by
  // /api/strategies). They are all listed under the "Custom" group at the top
  // of the indicator menu; each applied one is computed server-side and drawn
  // as an overlay. `customOverlays` is keyed by the applied-instance key.
  const [customCatalogue, setCustomCatalogue] = useState([]);
  const [customOverlays, setCustomOverlays] = useState({});
  const [customErrors, setCustomErrors] = useState({});

  // ---- models: named sets of indicator conditions that paint coloured zones
  const [models, setModels] = useState(() => loadModels());
  const [modelsOpen, setModelsOpen] = useState(false);
  // { id?, name, color, conditions: [...] } | null. `id` present == editing.
  const [draft, setDraft] = useState(null);
  // Several models can be applied at once, so this is a list of ids.
  const [activeModelIds, setActiveModelIds] = useState([]);
  const [modelRuns, setModelRuns] = useState([]);   // [{ modelId, runs }]
  const modelsRef = useRef(null);
  const runsRef = useRef([]);
  const timeScaleRef = useRef(null);
  const zonePrimRef = useRef(null);
  // Visible logical range, carried across chart rebuilds (theme flips).
  const savedRangeRef = useRef(null);

  // Catalogue entries for the Python indicators, shaped like a TA-Lib spec so
  // they can sit in the same list and share the menu / legend plumbing.
  const customSpecs = useMemo(() => customCatalogue.map(s => ({
    id: s.id,
    label: s.label || s.id,
    group: CUSTOM_GROUP,
    description: s.description || '',
    color: s.color || '#2157f3',
    palette: s.palette || null,
    params: s.params || {},
    optOrder: Object.keys(s.params || {}),
    custom: true,
    pane: false,
  })), [customCatalogue]);

  // Everything the chart can offer: custom (Python) indicators lead, then the
  // full TA-Lib catalogue.
  const specCatalogAll = useMemo(
    () => [...customSpecs, ...ALL_INDICATORS], [customSpecs]);

  // The applied indicators resolved against the catalogue, in applied order.
  // Drives the legend and the chart build.
  const activeSpecs = useMemo(() => active.map(a => {
    const spec = specCatalogAll.find(s => s.id === a.id);
    if (!spec) return null;
    const params = { ...(spec.params || {}), ...(a.params || {}) };
    return { ...spec, params, key: a.key, label: specLabel(spec, params) };
  }).filter(Boolean), [active, specCatalogAll]);

  const activeModels = models.filter(m => activeModelIds.includes(m.id));

  // The bars the chart is currently showing. The model editor derives its
  // slider spans from these, so the handles bracket the visible data.
  const visibleCandles = useMemo(() => {
    if (!data || !data.candles) return [];
    const n = PERIOD_BARS[period];
    return n == null ? data.candles : data.candles.slice(-n);
  }, [data, period]);

  // Persist on every change so a reload keeps the user's models.
  useEffect(() => { saveModels(models); }, [models]);

  // Drop ids that no longer exist (deleted models) from the applied list.
  useEffect(() => {
    setActiveModelIds(ids => {
      const live = ids.filter(id => models.some(m => m.id === id));
      return live.length === ids.length ? ids : live;
    });
  }, [models]);

  // Close the models menu on an outside click.
  useEffect(() => {
    if (!modelsOpen) return;
    const onDown = (e) => {
      const el = modelsRef.current;
      if (el && !el.contains(e.target)) setModelsOpen(false);
    };
    document.addEventListener('mousedown', onDown);
    return () => document.removeEventListener('mousedown', onDown);
  }, [modelsOpen]);

  // Re-evaluate every applied model whenever the data, period or models change.
  useEffect(() => {
    if (!activeModels.length || !visibleCandles.length) { setModelRuns([]); return; }
    setModelRuns(activeModels.map(m => ({
      modelId: m.id,
      runs: computeModelRuns(m, visibleCandles, data.volume),
    })));
  }, [activeModelIds, models, visibleCandles]);

  // Flatten every applied model's runs into one list for the primitive, then
  // ask for a repaint. Each run carries its model's colour.
  useEffect(() => {
    runsRef.current = modelRuns.flatMap(g => g.runs);
    const chart = chartRef.current;
    if (chart) chart.timeScale().applyOptions({});
  }, [modelRuns]);

  const toggleModel = (id) => setActiveModelIds(ids =>
    ids.includes(id) ? ids.filter(x => x !== id) : [...ids, id]);

  const deleteModel = (id) => {
    setModels(ms => ms.filter(m => m.id !== id));
    setActiveModelIds(ids => ids.filter(x => x !== id));
    setDraft(d => (d && d.id === id ? null : d));
  };

  const blankCond = () => ({ indicatorId: '', period: '', op: 'gte', lo: '', hi: '' });

  const startDraft = () => setDraft({
    name: '',
    color: nextModelColor(models),
    conditions: [blankCond()],
  });

  // Load an existing model into the editor. Editing keeps the same id, so
  // saving updates in place instead of creating a duplicate.
  const editModel = (m) => setDraft({
    id: m.id,
    name: m.name,
    color: m.color || DEFAULT_MODEL_COLOR,
    conditions: m.conditions.map(c => ({
      indicatorId: c.indicatorId || '',
      period: c.period === undefined || c.period === null ? '' : c.period,
      op: c.op || 'gte',
      lo: c.lo === undefined || c.lo === null ? '' : c.lo,
      hi: c.hi === undefined || c.hi === null ? '' : c.hi,
    })),
  });

  const setCond = (i, patch) => setDraft(d => {
    if (!d) return d;
    const conditions = d.conditions.map((c, j) => (j === i ? { ...c, ...patch } : c));
    return { ...d, conditions };
  });

  const addCond = () => setDraft(d => {
    if (!d || d.conditions.length >= MAX_CONDITIONS) return d;
    return { ...d, conditions: [...d.conditions, blankCond()] };
  });

  const removeCond = (i) => setDraft(d => {
    if (!d) return d;
    return { ...d, conditions: d.conditions.filter((_, j) => j !== i) };
  });

  // Create a new model, or update the one being edited in place.
  const saveModel = () => {
    if (!draft) return;
    const conditions = draft.conditions.filter(condValid);
    if (!conditions.length) return;
    const name = draft.name.trim() || 'Model ' + (models.length + 1);
    const color = draft.color || DEFAULT_MODEL_COLOR;

    if (draft.id) {
      setModels(ms => ms.map(m => (m.id === draft.id
        ? { ...m, name, color, conditions, updatedAt: new Date().toISOString() }
        : m)));
      setActiveModelIds(ids => (ids.includes(draft.id) ? ids : [...ids, draft.id]));
    } else {
      const model = {
        id: 'm' + Date.now().toString(36),
        name, color, conditions,
        createdAt: new Date().toISOString(),
      };
      setModels(ms => [...ms, model]);
      setActiveModelIds(ids => [...ids, model.id]);
    }
    setDraft(null);
  };

  // Full catalogue grouped by category, for the condition dropdowns.
  const modelsGroups = useMemo(() => {
    const groups = new Map();
    for (const spec of ALL_INDICATORS) {
      if (!groups.has(spec.group)) groups.set(spec.group, []);
      groups.get(spec.group).push(spec);
    }
    return [...groups.entries()];
  }, []);

  // Catalogue grouped by category, filtered by the search box. The "Custom"
  // group (Python indicators from src/indicators) always comes first.
  const menuGroups = useMemo(() => {
    const q = menuQuery.trim().toLowerCase();
    const groups = new Map();
    for (const spec of specCatalogAll) {
      if (q && !(spec.label.toLowerCase().includes(q) ||
                 spec.id.toLowerCase().includes(q) ||
                 spec.group.toLowerCase().includes(q))) continue;
      if (!groups.has(spec.group)) groups.set(spec.group, []);
      groups.get(spec.group).push(spec);
    }
    return [...groups.entries()].sort(([a], [b]) => {
      if (a === CUSTOM_GROUP) return -1;
      if (b === CUSTOM_GROUP) return 1;
      return 0;
    });
  }, [menuQuery, specCatalogAll]);

  // Every applied Python indicator is computed server-side from the bars of
  // the ticker and interval currently charted, so the overlay always matches
  // what is on screen. Switching either re-runs them.
  const customActiveKey = activeSpecs.filter(s => s.custom).map(s => s.key).join('||');
  useEffect(() => {
    const keys = customActiveKey ? customActiveKey.split('||') : [];
    if (!keys.length) { setCustomOverlays({}); setCustomErrors({}); return; }
    let dead = false;
    // Drop overlays of instances that are no longer applied.
    setCustomOverlays(o => {
      const kept = Object.fromEntries(Object.entries(o).filter(([k]) => keys.includes(k)));
      return Object.keys(kept).length === Object.keys(o).length ? o : kept;
    });
    const base = '?market=' + encodeURIComponent(market) +
                 '&symbol=' + encodeURIComponent(sym) +
                 '&interval=' + encodeURIComponent(interval);
    Promise.all(keys.map(key => {
      const spec = activeSpecs.find(s => s.key === key);
      if (!spec) return Promise.resolve();
      const qs = base + '&params=' + encodeURIComponent(JSON.stringify(spec.params || {}));
      return fetch('/api/strategies/' + encodeURIComponent(spec.id) + '/apply' + qs)
        .then(async r => ({ key, ok: r.ok, b: await readJson(r) }))
        .then(({ key: k, ok, b }) => {
          if (dead) return;
          if (!ok || b.error) {
            setCustomErrors(e => ({ ...e, [k]: b.error || 'Failed to apply indicator' }));
            setCustomOverlays(o => { const n = { ...o }; delete n[k]; return n; });
          } else {
            setCustomOverlays(o => ({ ...o, [k]: b.overlay }));
            setCustomErrors(e => { const n = { ...e }; delete n[k]; return n; });
          }
        })
        .catch(e => {
          if (!dead) setCustomErrors(x => ({ ...x, [key]: String(e.message || e) }));
        });
    }));
    return () => { dead = true; };
  }, [customActiveKey, sym, interval, market]);

  // Close the indicator menu on an outside click (panning the chart, clicking
  // a period pill, etc.) — it used to stay open forever.
  useEffect(() => {
    if (!menuOpen) return;
    const onDown = (e) => {
      const el = menuRef.current;
      if (el && !el.contains(e.target)) setMenuOpen(false);
    };
    document.addEventListener('mousedown', onDown);
    return () => document.removeEventListener('mousedown', onDown);
  }, [menuOpen]);

  // ---- Python indicators from src/indicators: load the catalogue once.
  useEffect(() => {
    let dead = false;
    fetch('/api/strategies')
      .then(readJson)
      .then(j => { if (!dead) setCustomCatalogue(j.strategies || []); })
      .catch(() => { if (!dead) setCustomCatalogue([]); });
    return () => { dead = true; };
  }, []);

  // ---- boot TA-Lib (WebAssembly) once
  useEffect(() => {
    let dead = false;
    const boot = async () => {
      try {
        if (!window.TA_LIB) throw new Error('TA-Lib script not loaded');
        // init() resolves to the Emscripten module; keep it so we can call the
        // raw TA_* entry points and read outBegIdx/outNbElement.
        const mod = await window.TA_LIB.init('/cdn/talib.wasm');
        window.__TA_WASM = mod;
        if (!dead) setTalibReady(true);
      } catch (e) {
        if (!dead) setError('TA-Lib failed to load: ' + (e.message || e));
      }
    };
    boot();
    return () => { dead = true; };
  }, []);

  // ---- fetch the OHLCV series for whichever ticker the header shows
  useEffect(() => {
    let dead = false;
    setLoading(true);
    setError(null);
    fetch('/api/prices/' + market + '/' + encodeURIComponent(sym) + '?interval=' + interval)
      .then(async r => ({ ok: r.ok, b: await readJson(r) }))
      .then(({ ok, b }) => {
        if (dead) return;
        if (!ok || b.error) { setError(b.error || 'Failed to load prices'); setData(null); }
        else setData(b);
      })
      .catch(e => { if (!dead) setError(String(e.message || e)); })
      .finally(() => { if (!dead) setLoading(false); });
    return () => { dead = true; };
  }, [sym, market, interval]);

  // ---- search universe: the market's scan rows, reduced to what the picker
  // needs. Fetched once per market so typing stays instant and offline.
  useEffect(() => {
    let dead = false;
    setUniverse([]);
    fetch('/api/markets/' + market + '/scan')
      .then(readJson)
      .then(j => {
        if (dead) return;
        const cols = j.columns || [];
        const ix = {};
        cols.forEach((c, i) => { ix[c.key] = i; });
        const rows = (j.rows || []).map(r => ({
          symbol: String(r[ix.symbol] ?? ''),
          name: String(r[ix.name] ?? ''),
          price: ix.price === undefined ? null : r[ix.price],
          chg: ix['1D %'] === undefined ? null : r[ix['1D %']],
        })).filter(u => u.symbol);
        setUniverse(rows);
      })
      .catch(() => { if (!dead) setUniverse([]); });
    return () => { dead = true; };
  }, [market]);

  // Swap the charted ticker without unmounting the modal, so the indicator
  // selection and active model survive the switch.
  const switchSymbol = (next) => {
    if (!next || next === sym) return;
    setSym(next);
    if (onSymbolChange) onSymbolChange(next);
  };

  // Escape closes the chart.
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);

  // ---- build the chart
  useEffect(() => {
    const el = boxRef.current;
    if (!el || !data || !window.LightweightCharts) return;
    const LC = window.LightweightCharts;

    if (chartRef.current) { chartRef.current.remove(); chartRef.current = null; }

    const css = getComputedStyle(document.documentElement);
    const tok = (n, fb) => (css.getPropertyValue(n) || '').trim() || fb;
    const ink = tok('--color-ink', '#e0e8e2');
    const line = tok('--color-line', '#1a2a1e');
    const surface = tok('--color-surface', '#111916');
    const accent = tok('--color-accent', '#00cc44');
    // Pane separators and scale borders: dull white on the dark theme, dull
    // black on the light one, so they stay visible without competing with the
    // candles.
    const paneLine = dark ? 'rgba(255,255,255,0.28)' : 'rgba(0,0,0,0.28)';

    const chart = LC.createChart(el, {
      width: el.clientWidth,
      height: el.clientHeight,
      layout: {
        background: { type: 'solid', color: surface },
        textColor: ink,
        fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace',
        fontSize: 11,
        // Separator drawn between stacked panes (price / RSI / MACD / ...).
        panes: { separatorColor: paneLine, separatorHoverColor: accent },
      },
      grid: { vertLines: { color: line }, horzLines: { color: line } },
      rightPriceScale: { borderColor: paneLine },
      timeScale: { borderColor: paneLine, rightOffset: 4, barSpacing: 6 },
      crosshair: { mode: LC.CrosshairMode.Normal },
      localization: { priceFormatter: (p) => p.toFixed(2) },
    });
    chartRef.current = chart;
    timeScaleRef.current = chart.timeScale();
    // Dev hook: lets the console (and automated checks) confirm which theme
    // colours the canvas actually received.
    window.__CHART_DEBUG = chart;

    const n = PERIOD_BARS[period];
    const tail = (arr) => (n == null ? arr : arr.slice(-n));
    const candles = tail(data.candles);
    if (!candles.length) return;

    // A theme flip rebuilds the chart. Carry the zoom/scroll position over so
    // switching themes does not throw the user back to the default view.
    const prevRange = savedRangeRef.current;

    // ---- price pane
    const priceSeries = chart.addSeries(LC.CandlestickSeries, {
      upColor: '#26a69a', downColor: '#ef5350',
      borderUpColor: '#26a69a', borderDownColor: '#ef5350',
      wickUpColor: '#26a69a', wickDownColor: '#ef5350',
    });
    priceSeries.setData(candles);

    // ---- green zones for the active model (drawn behind the candles)
    const zonePrim = makeZonePrimitive(() => runsRef.current, chart.timeScale());
    zonePrimRef.current = zonePrim;
    try { priceSeries.attachPrimitive(zonePrim); } catch {}

    // ---- indicators (TA-Lib via WASM)
    const times = candles.map(c => c.time);
    const src = {
      open: candles.map(c => c.open),
      high: candles.map(c => c.high),
      low: candles.map(c => c.low),
      close: candles.map(c => c.close),
      time: times,
    };
    // Volume is not in the candle payload; derive it from the volume series.
    const volByTime = new Map((data.volume || []).map(v => [v.time, v.value]));
    src.volume = times.map(t => volByTime.get(t) || 0);
    // MAVP needs a per-bar period series; use the catalogue's maxPeriod.
    src.inPeriods = times.map(() => 30);

    let paneIndex = 1;

    // TradingView's four-state MACD histogram: bright/dim green above zero
    // depending on whether the histogram is rising, bright/dim red below zero
    // depending on whether it is falling.
    const macdHistColors = (pts) => pts.map((p, i) => {
      const prev = i > 0 ? pts[i - 1].value : p.value;
      const rising = p.value > prev;
      const falling = p.value < prev;
      if (p.value >= 0) return rising ? '#26a69a' : '#26a69a66';
      if (p.value < 0) return falling ? '#ef5350' : '#ef535066';
      return 'rgba(255,255,255,0.10)';
    });

    for (const spec of activeSpecs) {
      // Call the raw WASM entry point so we get outBegIdx/outNbElement and a
      // correctly aligned output array.
      const res = talibRaw(spec, src, times.length);
      if (!res) continue;

      const draw = (outKey, color, hist, pane) => {
        const vals = res.outs[outKey];
        if (!vals) return;
        const pts = talibSeries(times, vals, res.begIdx);
        if (!pts.length) return;
        if (hist) {
          const s = chart.addSeries(LC.HistogramSeries, {
            priceLineVisible: false, lastValueVisible: false,
          }, pane);
          // MACD's histogram gets the four-state colouring; every other
          // histogram keeps the simple sign-based scheme.
          const colors = spec.id === 'MACD' ? macdHistColors(pts) : null;
          s.setData(pts.map((p, i) => ({
            time: p.time, value: p.value,
            color: colors ? colors[i]
                 : p.value > 0 ? '#26a69a99'
                 : p.value < 0 ? '#ef535099'
                 : 'rgba(255,255,255,0.10)',
          })));
        } else {
          const s = chart.addSeries(LC.LineSeries, {
            color: color, lineWidth: 1, priceLineVisible: false,
            lastValueVisible: !pane, crosshairMarkerVisible: false,
          }, pane);
          s.setData(pts);
          if (spec.guides && pane) {
            spec.guides.forEach(g => s.createPriceLine({
              price: g, color: '#6b7a70', lineWidth: 1, lineStyle: 2,
              axisLabelVisible: true, title: String(g),
            }));
          }
        }
      };

      if (spec.pane) {
        const p = paneIndex++;
        draw(spec.out, spec.color, spec.hist, p);
        (spec.extra || []).forEach(x => draw(x.out, spec.color, x.hist, p));
      } else {
        draw(spec.out, spec.color, spec.hist, 0);
        (spec.extra || []).forEach(x => draw(x.out, spec.color, x.hist, 0));
      }
    }

    // ---- Python indicator overlays (src/indicators, listed under Custom).
    // The payload is the same shape the JS Smart Money port emits, so it
    // reuses the band + smart-money primitives.
    for (const spec of activeSpecs) {
      if (!spec.custom) continue;
      const ov = customOverlays[spec.key];
      if (!ov) continue;
      const prim = makeBandPrimitive(() => ov, chart.timeScale(), priceSeries, spec.palette);
      try { priceSeries.attachPrimitive(prim); } catch {}
      const smPrim = makeSmartMoneyPrimitive(() => ov, chart.timeScale(), priceSeries);
      try { priceSeries.attachPrimitive(smPrim); } catch {}
    }

    // Size the panes proportionally. The price pane always keeps at least half
    // the height; the indicator panes split the rest evenly. Stretch factors
    // survive applyOptions({height}) resizes, whereas setHeight() gets
    // redistributed evenly on every resize.
    const sizePanes = () => {
      const panes = chart.panes();
      if (panes.length <= 1) return;
      const ind = panes.length - 1;
      panes[0].setStretchFactor(Math.max(3, ind));
      for (let i = 1; i < panes.length; i++) panes[i].setStretchFactor(1);
    };
    sizePanes();
    requestAnimationFrame(sizePanes);

    if (prevRange) {
      try { chart.timeScale().setVisibleLogicalRange(prevRange); } catch { chart.timeScale().fitContent(); }
    } else {
      chart.timeScale().fitContent();
    }

    const ro = new ResizeObserver(() => {
      if (chartRef.current) {
        chartRef.current.applyOptions({
          width: el.clientWidth, height: el.clientHeight,
        });
        sizePanes();
      }
    });
    ro.observe(el);

    return () => {
      // Remember where the user was looking before the chart is torn down.
      try { savedRangeRef.current = chart.timeScale().getVisibleLogicalRange(); } catch {}
      ro.disconnect();
      timeScaleRef.current = null;
      zonePrimRef.current = null;
      if (window.__CHART_DEBUG === chart) window.__CHART_DEBUG = null;
      if (chartRef.current) { chartRef.current.remove(); chartRef.current = null; }
    };
    // `dark` is a dependency because the chart is a canvas: the CSS tokens
    // cannot recolour it, so a theme flip has to rebuild it.
  }, [data, period, active, talibReady, dark, customOverlays]);

  const last = data && data.candles.length ? data.candles[data.candles.length - 1] : null;
  const prev = data && data.candles.length > 1 ? data.candles[data.candles.length - 2] : null;
  const chg = last && prev ? ((last.close / prev.close - 1) * 100) : null;

  const pill = (label, isActive, onClick) => h('button', {
    key: label, onClick,
    className: 'rounded-[6px] border px-2 py-0.5 text-[11px] font-semibold transition-colors ' +
               (isActive
                 ? 'border-accent bg-accent text-on-accent'
                 : 'border-border/40 text-muted hover:border-accent hover:text-accent'),
  }, label);

  // Add an indicator with its catalogue defaults, or remove every instance of
  // it. Adding the same function twice is allowed (different periods).
  const toggleIndicator = (spec) => setActive(a => {
    const mine = a.filter(x => x.id === spec.id);
    if (mine.length) return a.filter(x => x.id !== spec.id);
    const params = { ...(spec.params || {}) };
    return [...a, { key: spec.id + '|' + JSON.stringify(params), id: spec.id, params }];
  });

  const removeIndicator = (key) => setActive(a => a.filter(x => x.key !== key));

  // Clone an applied instance so the same function can be plotted twice with
  // different periods (EMA 5 and EMA 20 side by side).
  const duplicateIndicator = (srcKey) => setActive(a => {
    const src = a.find(x => x.key === srcKey);
    if (!src) return a;
    const params = { ...src.params };
    // Nudge the first numeric parameter so the copy is visibly different.
    const spec = specCatalogAll.find(s => s.id === src.id);
    const firstKey = spec ? specNumericKeys(spec)[0] : null;
    if (firstKey && Number.isFinite(Number(params[firstKey]))) {
      params[firstKey] = Math.max(1, Math.round(Number(params[firstKey]) / 2));
    }
    let newKey = src.id + '|' + JSON.stringify(params);
    let i = 2;
    while (a.some(x => x.key === newKey)) {
      newKey = src.id + '|' + JSON.stringify(params) + '#' + i++;
    }
    return [...a, { key: newKey, id: src.id, params }];
  });

  // Change one parameter of one applied instance. The key is rebuilt so two
  // instances of the same function stay distinct.
  const setIndicatorParam = (key, paramKey, value) => setActive(a => a.map(x => {
    if (x.key !== key) return x;
    const params = { ...x.params, [paramKey]: value };
    return { ...x, params, key: x.id + '|' + JSON.stringify(params) };
  }));

  return h('div', {
    // Full screen below the 72px app header.
    className: 'fixed inset-x-0 bottom-0 top-[72px] z-[300] flex flex-col bg-surface',
  },
    // ---- toolbar
    h('div', {
      className: 'flex shrink-0 flex-wrap items-center gap-3 border-b-2 border-border px-4 py-2',
    },
      h('div', { className: 'flex min-w-0 items-baseline gap-2' },
        h(TickerSearch, { symbol: sym, universe, onPick: switchSymbol }),
        last ? h('span', { className: 'font-mono text-[14px] font-semibold text-ink' },
          last.close.toFixed(2) + ' ' + currency) : null,
        chg !== null ? h('span', {
          className: 'font-mono text-[12px] font-semibold ' +
                     (chg >= 0 ? 'text-accent' : 'text-[#ef4444]'),
        }, (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%') : null,
        data ? h('span', { className: 'text-[11px] text-muted' },
          data.bars + ' bars') : null),
      h('div', { className: 'ml-auto flex items-center gap-1' },
        CHART_PERIODS.map(p => pill(p, period === p, () => setPeriod(p)))),
      h('div', { className: 'flex items-center gap-1 border-l border-border/40 pl-2' },
        CHART_INTERVALS.map(iv => pill(iv, interval === iv, () => setInterval(iv)))),
      // ---- indicator picker
      h('div', { className: 'relative border-l border-border/40 pl-2' },
        h('button', {
          onClick: () => setMenuOpen(o => !o),
          className: 'rounded-[6px] border border-[#b8860b] bg-[#ffd700] px-2 py-0.5 ' +
                     'text-[11px] font-bold text-black transition-colors ' +
                     'hover:bg-[#ffdf33] hover:border-[#8b6508]',
        }, 'Indicators (' + active.length + ') ' + (menuOpen ? '▲' : '▼')),
        menuOpen ? h('div', {
          ref: menuRef,
          className: 'absolute right-0 top-full z-[310] mt-1 flex w-[400px] ' +
                     'max-h-[calc(100vh-130px)] flex-col overflow-hidden rounded-[8px] ' +
                     'border-2 border-border bg-surface ' +
                     'shadow-[0_12px_32px_rgba(0,0,0,.5)]',
        },
          // header with an explicit close button
          h('div', {
            className: 'flex shrink-0 items-center justify-between border-b border-border/40 ' +
                       'px-3 py-2',
          },
            h('span', { className: 'text-[11px] font-semibold uppercase tracking-wide text-muted' },
              'Indicators · ' + specCatalogAll.length),
            h('button', {
              onClick: () => setMenuOpen(false), title: 'Close menu',
              className: 'rounded-[4px] px-1.5 text-[13px] font-bold leading-none text-muted ' +
                         'transition-colors hover:bg-[#ef4444] hover:text-white',
            }, '✕')),
          // search + bulk actions
          h('div', { className: 'flex shrink-0 items-center gap-1.5 border-b border-border/40 px-2 py-2' },
            h('div', { className: 'relative min-w-0 flex-1' },
              h('input', {
                value: menuQuery,
                onChange: (e) => setMenuQuery(e.target.value),
                placeholder: 'Search indicators…',
                className: 'w-full rounded-[4px] border border-border/40 bg-transparent ' +
                           'px-2 py-1.5 pr-6 font-mono text-[12px] text-ink outline-none ' +
                           'placeholder:text-muted focus:border-accent',
              }),
              // clear just the search text
              menuQuery ? h('button', {
