/* ============================================================== data load */
// "Data Load" dropdown: sky-blue button that opens a menu with two actions.
//   Refresh Market Index list -> POST /api/refresh-index
//                                (`pixi run refresh_market_index_list`)
//   Incremental Load          -> POST /api/update-data
//                                (`pixi run update-data`)
// Incremental Load is rate-limited: a run that finished less than this long ago
// blocks the next one, so a double-click (or an impatient re-click) cannot kick
// off a second full Yahoo sweep.
const INCREMENTAL_COOLDOWN_MS = 10 * 60 * 1000;

function DataLoad({ markets }) {
  const [open, setOpen] = useState(false);
  const [busy, setBusy] = useState(null);       // 'index' | 'incremental' | null
  const [result, setResult] = useState(null);   // { ok, log } | { ok:false, error }
  const [lastUpdated, setLastUpdated] = useState(null);   // ISO string | null
  // Ticks while the menu is open so the cooldown countdown updates and the
  // button re-enables on its own without a reload.
  const [now, setNow] = useState(() => Date.now());
  const boxRef = useRef(null);

  // Pull the run timestamp from data/last_updated.json (via the API).
  const loadLastUpdated = async () => {
    try {
      const r = await fetch('/api/last-updated');
      const b = await readJson(r);
      setLastUpdated(b.last_updated || null);
    } catch { setLastUpdated(null); }
  };

  useEffect(() => { loadLastUpdated(); }, []);
  // Refresh the stamp whenever the menu is opened.
  useEffect(() => { if (open) loadLastUpdated(); }, [open]);

  // Tick once a second while the menu is open, but only while a cooldown is
  // actually running — no point re-rendering forever.
  const cooldownLeftMs = useMemo(() => {
    if (!lastUpdated) return 0;
    const t = new Date(lastUpdated).getTime();
    if (!Number.isFinite(t)) return 0;
    return Math.max(0, t + INCREMENTAL_COOLDOWN_MS - now);
  }, [lastUpdated, now]);

  useEffect(() => {
    if (!open || cooldownLeftMs <= 0) return;
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, [open, cooldownLeftMs > 0]);

  // Re-sync the clock whenever the menu opens or the stamp changes.
  useEffect(() => { setNow(Date.now()); }, [open, lastUpdated]);

  const cooldownActive = cooldownLeftMs > 0;
  const cooldownText = (() => {
    const s = Math.ceil(cooldownLeftMs / 1000);
    const m = Math.floor(s / 60);
    const r = s % 60;
    return m > 0 ? m + 'm ' + String(r).padStart(2, '0') + 's' : r + 's';
  })();

  // Close on outside click / Escape.
  useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    document.addEventListener('keydown', onKey);
    return () => {
      document.removeEventListener('mousedown', onDoc);
      document.removeEventListener('keydown', onKey);
    };
  }, [open]);

  // Shared runner: POST to an endpoint, show the returned log.
  const run = async (kind, url, okMessage) => {
    setBusy(kind);
    setResult(null);
    try {
      const r = await fetch(url, { method: 'POST' });
      const body = await readJson(r);
      setResult(body.ok
        ? { ok: true, log: body.log || okMessage }
        : { ok: false, error: body.error || body.log || ('HTTP ' + r.status) });
    } catch (e) {
      setResult({ ok: false, error: String(e.message || e) });
    } finally {
      setBusy(null);
      loadLastUpdated();   // the run just moved the timestamp
    }
  };

  const runRefresh = () => run('index', '/api/refresh-index', 'Index list refreshed.');

  // The disabled attribute is the UI guard; this is the real one, so a stale
  // render or a programmatic click cannot start a second run inside the window.
  const runIncremental = () => {
    if (busy) return;
    if (cooldownActive) {
      setResult({ ok: false, error: 'Already refreshed ' + fmtStamp(lastUpdated) +
                                    ' — try again in ' + cooldownText + '.' });
      return;
    }
    const market = markets.us === markets.india
      ? ''
      : '?market=' + (markets.us ? 'us' : 'india');
    run('incremental', '/api/update-data' + market, 'Incremental load finished.');
  };

  // "2026-11-01T17:26:00" -> "01 Nov 2026, 17:26"
  const fmtStamp = (iso) => {
    if (!iso) return 'never';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    const p = (n) => String(n).padStart(2, '0');
    const mon = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()];
    return p(d.getDate()) + ' ' + mon + ' ' + d.getFullYear() +
           ', ' + p(d.getHours()) + ':' + p(d.getMinutes());
  };

  return h('div', { ref: boxRef, className: 'relative' },
    h('button', {
      onClick: () => setOpen(o => !o),
      title: 'Data load actions',
      className: 'flex items-center gap-2 rounded-[7px] border-2 border-border bg-[#38bdf8] px-3 py-1.5 ' +
                 'whitespace-nowrap text-[12px] font-semibold text-[#04140a] transition-colors ' +
                 'hover:bg-[#7dd3fc]',
    },
      'Data Load',
      h('span', { className: 'text-[9px]' }, open ? '▲' : '▼')),
    open ? h('div', {
      className: 'absolute right-0 top-full z-[200] mt-1 w-[300px] overflow-hidden rounded-[10px] ' +
                 'border-2 border-border bg-surface shadow-[0_12px_32px_rgba(0,0,0,.45)]',
    },
      // ---- Last Updated (top of the menu) — label and value on one line
      h('div', {
        className: 'flex items-center justify-between gap-2 border-b-2 border-border px-3 py-2',
      },
        h('span', { className: 'text-[14px] font-semibold uppercase tracking-wide text-muted' },
          'Last Updated'),
        h('span', {
          className: 'font-mono text-[14px] font-semibold ' +
                     (lastUpdated ? 'text-accent' : 'text-[#ef4444]'),
        }, fmtStamp(lastUpdated))),
      h('div', { className: 'flex flex-col gap-2 px-3 py-3' },
        // ---- Refresh Market Index list (green)
        h('button', {
          onClick: runRefresh,
          disabled: !!busy,
          title: 'When clicked it will pull latest list of SNP500, NIFTY500. Because the list get updated there might be few companies which get added /removed',
          className: 'rounded-[8px] border-2 border-border bg-accent px-3 py-2 text-[15px] ' +
                     'font-semibold text-on-accent transition-colors hover:bg-glow ' +
                     (busy ? 'cursor-wait opacity-60' : ''),
        }, busy === 'index' ? 'Refreshing…' : 'Refresh Market Index list'),
        // ---- Incremental Load (blue) — blocked for 10 minutes after a run
        h('button', {
          onClick: runIncremental,
          disabled: !!busy || cooldownActive,
          title: cooldownActive
            ? 'Already refreshed ' + fmtStamp(lastUpdated) +
              ' — available again in ' + cooldownText
            : 'When clicked it will check the last modified date and brings only incremental updates saving internet data bandwidth',
          className: 'mt-1 rounded-[8px] border-2 border-border px-3 py-2 text-[15px] ' +
                     'font-semibold transition-colors ' +
                     (cooldownActive
                       ? 'cursor-not-allowed bg-[#2563eb]/40 text-white/60'
                       : 'bg-[#2563eb] text-white hover:bg-[#3b82f6]') +
                     (busy ? ' cursor-wait opacity-60' : ''),
        }, busy === 'incremental' ? 'Loading…'
           : cooldownActive ? 'Incremental Load · ' + cooldownText
           : 'Incremental Load')),
      result ? h('div', {
        className: 'max-h-[160px] overflow-auto border-t-2 border-border px-3 py-2 font-mono ' +
                   'text-[10px] leading-snug ' + (result.ok ? 'text-accent' : 'text-[#ef4444]'),
      }, result.ok ? result.log : result.error) : null) : null);
}

/* ================================================================ header */
function Header({ activeTab, markets, onMarketSelectionChange, onTab, onClear,
                  search, onSearch, dark, onToggleTheme,
                  columns, prefs, onPrefsChange, onResetPrefs }) {
  // Market tabs: sized to fill the header bar, with a bright glow on hover.
  // The glow colour is a token so it reads well on both themes.
  const tab = (key, cls, label) => {
    const checked = markets[key];
    const otherMarket = key === 'us' ? 'india' : 'us';
    return h('div', {
      key: key,
      className: 'market-tab flex items-center gap-2 whitespace-nowrap rounded-lg px-3 py-1.5 ' +
                 'transition-all duration-150 ' + cls +
                 (activeTab === key ? ' is-active' : ''),
    },
      h('input', {
        type: 'checkbox',
        checked: checked,
        disabled: checked && !markets[otherMarket],
        onChange: e => onMarketSelectionChange(key, e.target.checked),
        'aria-label': 'Include ' + label + ' in incremental loads',
        className: 'h-4 w-4 cursor-pointer accent-[#00cc44] disabled:cursor-not-allowed',
      }),
      h('button', {
        type: 'button',
        onClick: () => onTab(key),
        disabled: !checked,
        'aria-current': activeTab === key ? 'page' : undefined,
        className: 'whitespace-nowrap text-[12px] font-bold text-white disabled:cursor-not-allowed',
      }, label));
  };
  return h('div', {
    // left (market tabs) | right (controls).
    //
    // z-[400] keeps the header (and therefore the Columns / Data Load
    // dropdowns it owns) above the chart modal, which is z-[300]. The modal
    // starts at top-[72px], so the bar itself never covers the chart — only
    // the dropdowns that hang below it do, which is the intent.
    className: 'relative sticky top-0 z-[400] flex h-[72px] items-center gap-3 ' +
               'border-b-2 border-border bg-surface/85 px-5 backdrop-blur-[12px]',
  },
    // ---- left: market tabs
    h('div', { className: 'flex h-full min-w-0 flex-1 items-center gap-3 py-2' },
      tab('us', 'bg-[#1e3a5f]', 'USA — S&P 500'),
      tab('india', 'bg-[#1a3d1a]', 'INDIA — NIFTY 500')),
    // ---- right: search / theme / clear filters / column selector
    h('div', { className: 'flex shrink-0 items-center justify-end gap-2 whitespace-nowrap' },
      h('input', {
        type: 'text', value: search, onChange: e => onSearch(e.target.value),
        placeholder: 'Search ticker or name…',
        className: 'w-[220px] shrink rounded-[10px] border-2 border-border bg-surface px-3 py-1.5 text-[13px] ' +
                   'text-ink placeholder:text-muted focus:border-accent focus:outline-none',
      }),
      h('button', {
        onClick: onToggleTheme,
        title: dark ? 'Switch to light theme' : 'Switch to dark theme',
        className: 'theme-btn shrink-0 whitespace-nowrap rounded-[7px] border-2 border-border px-3 py-1.5 ' +
                   'text-[12px] font-semibold transition-colors',
      }, dark ? '☀ Light' : '☾ Dark'),
      h(DataLoad, { markets }),
      h(ColumnSelector, {
        columns, prefs, onChange: onPrefsChange, onReset: onResetPrefs,
      }),
      // Clear filters sits last, after the dropdowns.
      h('button', { onClick: onClear,
        className: 'shrink-0 whitespace-nowrap rounded-[7px] border-2 border-border bg-accent px-4 py-1.5 ' +
                   'text-[12px] font-semibold text-on-accent transition-colors hover:bg-glow'
      }, 'Clear filters')));
}

/* ================================================================== app */
// Column layout prefs (order + hidden keys) per market tab, persisted in
// localStorage so they survive a page refresh.
const PREFS_KEY = 'trading.tablePrefs.v1';
const MARKET_SELECTION_KEY = 'trading.marketSelection.v1';
const ACTIVE_INDICATORS_KEY = 'trading.activeIndicators.v1';
const EMPTY_PREFS = { order: [], hidden: [] };

function loadActiveIndicators() {
  try {
    const saved = JSON.parse(localStorage.getItem(ACTIVE_INDICATORS_KEY) || 'null');
    if (!Array.isArray(saved)) return [];
    return saved.filter(item =>
      item && typeof item.key === 'string' && typeof item.id === 'string' &&
      item.params && typeof item.params === 'object' && !Array.isArray(item.params));
  } catch { return []; }
}

function loadMarketSelection() {
  const fallback = { markets: { us: true, india: true }, activeTab: 'us' };
  try {
    const saved = JSON.parse(localStorage.getItem(MARKET_SELECTION_KEY) || 'null');
    if (!saved || typeof saved !== 'object' || !saved.markets) return fallback;
    const markets = {
      us: saved.markets.us === true,
      india: saved.markets.india === true,
    };
    if (!markets.us && !markets.india) return fallback;
    const activeTab = markets[saved.activeTab] ? saved.activeTab
      : markets.us ? 'us' : 'india';
    return { markets, activeTab };
  } catch { return fallback; }
}

function loadPrefs() {
  try {
    const raw = localStorage.getItem(PREFS_KEY);
    const p = raw ? JSON.parse(raw) : null;
    return (p && typeof p === 'object') ? p : {};
  } catch { return {}; }
}

function App() {
  const [marketSelection, setMarketSelection] = useState(loadMarketSelection);
  const activeTab = marketSelection.activeTab;
  const markets = marketSelection.markets;
  const [usData, setUsData] = useState(null);
  const [indiaData, setIndiaData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [search, setSearch] = useState('');
  const [dark, setDark] = useState(true);
  const [prefs, setPrefs] = useState(loadPrefs);
  const [activeIndicators, setActiveIndicators] = useState(loadActiveIndicators);
  const [epoch, setEpoch] = useState(0);   // bump to force a table rebuild
  const [filterReset, setFilterReset] = useState(0);   // bump to clear column filters
  const [chartSymbol, setChartSymbol] = useState(null);   // ticker shown in the chart modal
  const [preSplashDone, setPreSplashDone] = useState(false);
  const [splashFinished, setSplashFinished] = useState(false);
  // The splash owns the first ~4s. Building the grid before it finishes makes
  // the splash zoom stutter, so the table waits for the splash to hand over.
  const [booted, setBooted] = useState(false);

  // Persist on every change (order from header drags, hidden from the menu).
  useEffect(() => {
    try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch { /* quota / private mode */ }
  }, [prefs]);

  useEffect(() => {
    try { localStorage.setItem(MARKET_SELECTION_KEY, JSON.stringify(marketSelection)); }
    catch { /* quota / private mode */ }
  }, [marketSelection]);

  useEffect(() => {
    try { localStorage.setItem(ACTIVE_INDICATORS_KEY, JSON.stringify(activeIndicators)); }
    catch { /* quota / private mode */ }
  }, [activeIndicators]);

  const updateMarketSelection = (market, checked) => setMarketSelection(current => {
    const nextMarkets = { ...current.markets, [market]: checked };
    if (!nextMarkets.us && !nextMarkets.india) return current;
    return {
      markets: nextMarkets,
      activeTab: nextMarkets[current.activeTab] ? current.activeTab
        : nextMarkets.us ? 'us' : 'india',
    };
  });

  const tabPrefs = prefs[activeTab] || EMPTY_PREFS;

  const updateTabPrefs = (patch) => setPrefs(p => ({
    ...p,
    [activeTab]: { ...EMPTY_PREFS, ...(p[activeTab] || {}), ...patch },
  }));

  const resetTabPrefs = () => {
    setPrefs(p => ({ ...p, [activeTab]: { ...EMPTY_PREFS } }));
    setEpoch(e => e + 1);   // rebuild so the original column order returns
  };

  // The theme switch flips a data-theme attribute on <html>; the CSS tokens
  // in <style type="text/tailwindcss"> do the rest.
  //
  // This MUST be a layout effect: the chart is a canvas that reads the tokens
  // through getComputedStyle, and child passive effects run before parent
  // passive effects. A plain useEffect here would let ChartModal rebuild the
  // chart from the OLD theme's colours. Layout effects all run before any
  // passive effect, so the attribute is already correct by then.
  useLayoutEffect(() => {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }, [dark]);

  const data = activeTab === 'us' ? usData : indiaData;
  const colIdx = useMemo(() => {
    const m = {}; (data?.columns || []).forEach((c, i) => { m[c.key] = i; }); return m;
  }, [data]);

  useEffect(() => {
    (async () => {
      try {
        const [usR, inR] = await Promise.all([
          fetch('/api/markets/us/scan'), fetch('/api/markets/india/scan'),
        ]);
        const [usB, inB] = await Promise.all([readJson(usR), readJson(inR)]);
        if (!usR.ok) throw new Error('US: ' + (usB.error || usR.status));
        if (!inR.ok) throw new Error('India: ' + (inB.error || inR.status));
        setUsData(usB);
        setIndiaData(inB);
      } catch (e) { setError('Failed to load data: ' + e.message); }
      finally { setLoading(false); }
    })();
  }, []);

  // Search filter only — Tabulator handles sorting itself (click a header).
  const filteredRows = useMemo(() => {
    const d = data; if (!d || !d.rows) return [];
    const q = search.trim().toLowerCase();
    if (!q || colIdx.symbol === undefined) return d.rows;
    return d.rows.filter(r => {
      const sym = String(r[colIdx.symbol] || '').toLowerCase();
      const nm = String(r[colIdx.name] || '').toLowerCase();
      return sym.includes(q) || nm.includes(q);
    });
  }, [data, search, colIdx]);

  // rows = the (sorted) array the grid renders. Its length is the row count
  const switchTab = (t) => {
    if (!markets[t]) return;
    setMarketSelection(current => ({ ...current, activeTab: t }));
    setSearch('');
    setChartSymbol(null);
  };
  const clearFilters = () => { setSearch(''); setFilterReset(n => n + 1); };

  // Clicking a row opens the chart modal for that ticker.
  const openChart = (sym) => setChartSymbol(sym);

  return h(React.Fragment, null,
    // The splash unmounts itself (returns null) once its fade finishes; onDone
    // only releases the grid build.
    h(PreSplash, {
      splashFinished,
      onComplete: () => setPreSplashDone(true),
    }),
    preSplashDone ? h(SplashScreen, {
      onDone: () => setBooted(true),
      onFinished: () => setSplashFinished(true),
    }) : null,
    h('div', { className: 'flex h-screen flex-col overflow-hidden' },
      h(Header, {
        activeTab, markets, onMarketSelectionChange: updateMarketSelection,
        onTab: switchTab, onClear: clearFilters,
        search, onSearch: setSearch, dark, onToggleTheme: () => setDark(d => !d),
        columns: data ? data.columns : [],
        prefs: tabPrefs, onPrefsChange: updateTabPrefs, onResetPrefs: resetTabPrefs,
      }),
      loading ? h('div', { className: 'mx-5 mt-4 rounded-[10px] border-2 border-accent/40 bg-accent/[.06] p-3 font-mono text-[13px] text-accent' }, 'Loading…') : null,
      error ? h('div', { className: 'mx-5 mt-4 rounded-[10px] border-2 border-[#ef4444]/50 bg-[#ef4444]/[.06] p-3 font-mono text-[13px] text-[#ef4444]' }, error) : null,
      data && booted
        ? h(DataTable, {
            columns: data.columns, rows: filteredRows,
            prefs: tabPrefs, onPrefsChange: updateTabPrefs, epoch, filterReset,
            onRowClick: openChart,
          })
        : null),
    chartSymbol
      ? h(ChartModal, {
          symbol: chartSymbol,
          market: activeTab,
          currency: (data && data.currency) || '',
          active: activeIndicators,
          setActive: setActiveIndicators,
          // The chart is a canvas, so it cannot inherit the CSS tokens. It has
          // to be rebuilt when the theme flips.
          dark,
          onClose: () => setChartSymbol(null),
          // Keep the parent's notion of the open ticker in sync so reopening
          // the modal starts from the last chart viewed.
          onSymbolChange: setChartSymbol,
        })
      : null);
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
